<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Field Inspection Tool</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b5fb0">
<style>
  :root{
    --bg:#ffffff; --bg2:#f4f5f7; --line:#c7cbd1; --text:#111417; --sub:#5b616b;
    --accent:#0b5fb0; --accent-bg:#e5f0fb; --good:#1a7a3c; --warn:#a35a00; --danger:#b3261e;
  }
  *{box-sizing:border-box;}
  html, body{overscroll-behavior:none;}
  body{margin:0;font-family:-apple-system,Roboto,Segoe UI,Arial,sans-serif;background:var(--bg2);color:var(--text);font-size:18px;}
  .app{max-width:900px;margin:0 auto;background:var(--bg);}
  .topbar{padding:16px;border-bottom:2px solid var(--line);background:var(--bg);}
  .backbtn{display:block;width:100%;font-size:19px;font-weight:700;padding:14px 18px;border-radius:12px;border:2px solid var(--accent);background:var(--accent-bg);color:var(--accent);min-height:54px;margin-bottom:12px;}
  .addr-line{font-size:16px;font-weight:600;color:var(--sub);margin:0 0 2px;}
  .topbar h1{font-size:20px;margin:0;font-weight:700;}
  .propheader{border-bottom:2px solid var(--line);background:var(--bg);}
  .propheader-top{padding:16px 16px 12px;}
  .propheader-top .row{align-items:flex-start;}
  .tabbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);}
  .tabbtn{font-size:15px;font-weight:700;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg2);color:var(--text);min-height:44px;}
  .tabbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tabbtn.addtab{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);}
  .roomcard.alt{background:var(--bg2);}
  .room-name-select{color:#0b5fb0 !important;}
  .btn{font-size:18px;font-weight:600;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);padding:14px 18px;min-height:52px;}
  .btn:active{background:var(--bg2);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-ghost{border:none;background:none;color:var(--accent);font-weight:700;}
  .btn-sm{padding:8px 12px;font-size:15px;min-height:40px;}
  .content{padding:16px;}
  .card{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .label{font-size:20px;font-weight:700;margin:0;}
  .sub{font-size:15px;color:var(--sub);margin:2px 0 0;}
  .fieldhead{font-size:16px;font-weight:700;margin:10px 0 0;}
  .chiprow{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .chip{font-size:17px;font-weight:600;padding:14px 18px;border-radius:12px;border:2px solid var(--line);background:var(--bg);min-height:50px;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  .chip.selected{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:2px solid var(--line);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;}
  .thumb .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:1;}
  textarea{width:100%;font-size:17px;font-family:inherit;border:2px solid var(--line);border-radius:12px;padding:12px;min-height:70px;resize:vertical;}
  input[type=text]{width:100%;font-size:19px;font-family:inherit;border:2px solid var(--line);border-radius:12px;padding:14px;min-height:52px;}
  select{width:100%;font-size:19px;font-family:inherit;border:2px solid var(--line);border-radius:12px;padding:14px;min-height:52px;background:var(--bg);color:var(--text);}
  .section-list button.navrow{width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:700;}
  .navrow .count{font-size:15px;font-weight:600;color:var(--sub);}
  .navrow .count.done{color:var(--good);}
  .proprow{display:flex;gap:8px;margin-bottom:12px;align-items:stretch;}
  .proprow .navrow{flex:1;margin-bottom:0;}
  .proprow .sidebtns{display:flex;flex-direction:column;gap:6px;}
  .proprow .sidebtns .btn{min-height:auto;padding:8px 12px;font-size:14px;}
  .levelcard{border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px;background:var(--bg2);}
  .levelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .levelhead .label{font-size:21px;}
  .safetyblock{background:var(--bg);border:2px solid var(--warn);border-radius:14px;padding:14px;margin-bottom:14px;}
  .roomcard{border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--bg);}
  .roomcard .row{margin-bottom:6px;}
  .mechcard{border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--bg);}
  .footer-actions{background:var(--bg);border-top:2px solid var(--line);padding:16px;display:flex;gap:10px;}
  .footer-actions .btn{flex:1;}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:12px;font-size:16px;max-width:90%;text-align:center;z-index:50;}
  .hint{font-size:15px;color:var(--sub);margin-top:6px;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ---------- Storage (IndexedDB) ---------- */
const DB_NAME='fieldTool', DB_VERSION=1, STORE='properties';
let dbPromise = new Promise((resolve,reject)=>{
  const req = indexedDB.open(DB_NAME, DB_VERSION);
  req.onupgradeneeded = e=>{
    const db = e.target.result;
    if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:'id'});
  };
  req.onsuccess = e=>resolve(e.target.result);
  req.onerror = e=>reject(e);
});
async function dbPut(prop){
  const db = await dbPromise;
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(prop);
    tx.oncomplete=()=>res(); tx.onerror=e=>rej(e);
  });
}
async function dbGetAll(){
  const db = await dbPromise;
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess=()=>res(req.result||[]); req.onerror=e=>rej(e);
  });
}
async function dbDelete(id){
  const db = await dbPromise;
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete=()=>res(); tx.onerror=e=>rej(e);
  });
}

/* ---------- App state ---------- */
let properties = [];
let currentPropId = null;
let currentTab = 'exterior';
let uiScale = parseFloat(localStorage.getItem('fieldTool.uiScale')) || 1;
const PHOTO_SIZE_PRESETS = {
  Small:  { maxDim: 1000, quality: 0.6 },
  Medium: { maxDim: 1600, quality: 0.75 },
  Large:  { maxDim: 2200, quality: 0.85 }
};
let photoSizeSetting = localStorage.getItem('fieldTool.photoSize') || 'Medium';

const EXTERIOR_TILES_FRONT = [
  ['front','Front'],
  ['frontSide1','Front and side 1'],
  ['frontSide2','Front and side 2'],
];
const EXTERIOR_TILES_STREET = [
  ['streetScene1','Street scene 1'],
  ['streetScene2','Street scene 2'],
];
const EXTERIOR_TILES_REAR = [
  ['rear','Rear'],
  ['alley','Alley'],
  ['rearSide1','Rear and side 1'],
  ['rearSide2','Rear and side 2'],
];
const EXTERIOR_TILES = [...EXTERIOR_TILES_FRONT, ...EXTERIOR_TILES_STREET, ...EXTERIOR_TILES_REAR];

const FOUNDATION_MATERIALS = ['Concrete block','Poured concrete','Stone','Post and beam'];
const FOUNDATION_TYPES = ['Slab','Partial basement','Full basement','Crawlspace'];

// NOTE: these type lists are standard industry terms, not copied from a verified
// Fannie Mae enumeration list (I couldn't confirm the literal UAD 3.6 wording).
// Easy to relabel here once you compare against AIVRE's actual dropdowns.
const EXTERIOR_COMPONENTS = [
  ['sidingTrim','Siding and trim', ['Vinyl','Wood','Brick','Brick veneer','Stucco','Fiber cement','Aluminum','Stone veneer','Log','Composite','Other'], 'Material'],
  ['windows','Windows', ['Wood-framed','Metal framed','Vinyl-framed','Single-pane','Double pane','Multi-pane','Other']],
  ['roof','Roof', ['Composition shingle','Architectural shingle','Preformed metal','Tile','Slate','Wood shake','Flat / membrane','Other'], 'Material'],
];

const CEILING_HEIGHT_OPTIONS = ['6 ft or less','7 ft','8 ft','9 ft','10 ft','11 ft','12 ft or more'];
const CEILING_STYLE_OPTIONS = ['Flat','Vaulted'];
const CONDITION_OPTIONS = ['New / like new','Typical wear and tear'];
const FLOORING_OPTIONS = ['Carpet','Wood','Vinyl','LVP','Tile','Laminate','Concrete','Other'];
const UPDATED_TIMEFRAMES = ['Less than 1 year','1 to 10 years'];
const FENCE_MATERIALS = ['Wood','Metal','Vinyl','Chain link'];
const FURNACE_FUELS = ['Gas','Electric','Oil','Propane'];
const WATER_HEATER_FUELS = ['Gas','Electric'];
const DRIVEWAY_MATERIALS = ['Concrete','Asphalt','Gravel','Dirt'];
const DRIVEWAY_CAPACITIES = ['1','2','3','4+'];
const GARAGE_CAPACITIES = ['1','2','3'];
const GARAGE_ATTACHMENTS = ['Attached','Detached'];

// Porch/Patio/Deck: [key, label, type options, material options]
const EXTERIOR_FEATURES = [
  ['porch','Porch', ['Open','Covered','Enclosed','Screened'], ['Wood','Concrete','Composite','Brick','Stone','Other']],
  ['patio','Patio', ['Open','Covered'], ['Concrete','Pavers','Stone','Brick','Other']],
  ['deck','Deck', ['Open','Covered'], ['Wood','Composite','Other']],
];

const ROOM_NAME_OPTIONS = [
  'Living room','Dining room','Kitchen','Family room','Primary bedroom','Bedroom',
  'Primary bathroom','Bathroom','Half bathroom','Office / den','Laundry room',
  'Hallway / entry','Loft','Bonus room','Utility room','Other'
];
function isKitchenOrBath(name){ return /kitchen|bathroom/i.test(name||''); }

function newProperty(address){
  const components = {};
  EXTERIOR_COMPONENTS.forEach(([key])=>{ components[key] = {types:[], condition:null}; });
  const features = {};
  EXTERIOR_FEATURES.forEach(([key])=>{ features[key] = {present:null, type:null, materials:[], photos:[]}; });
  return {
    id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    address: address || '',
    createdAt: Date.now(),
    exported: false,
    appointment: null,       // datetime-local string
    effectiveDate: null,     // date string
    occupancy: null,         // 'Occupied' | 'Vacant'
    fileNumber: '',
    exterior: { photos: {}, components, features, outbuildingPresent: null, outbuildingPhotos: [],
                entranceHeight: null, notes: '',
                fence: { front: {present:null, materials:[], photos:[]}, rear: {present:null, materials:[], photos:[]} },
                driveway: { present:null, materials:[], capacity:null, photos:[] },
                garage: { present:null, capacity:null, attachment:null, exteriorPhotos:[], interiorPhotos:[] },
                sprinkler: { present:null, photos:[] },
                foundation: { materials:[], types:[], condition:null } },
    levels: [],
    generalNotes: ''
  };
}

function mkRoom(name){
  return {
    id:'r_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name:name||'',
    roomPhotos:[], flooringType:null, flooringPhotos:[],
    ceilingHeight:null, ceilingStyle:null, condition:null, notes:'',
    updated: { yesNo:null, what:'', when:null }
  };
}
function mkMechItem(label){
  return { id:'m_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), label:label||'', photos:[], strapped:null, fuelType:null };
}
function mkLevel(label){
  const isMech = (label==='M1');
  const lvl = { id:'l_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), label:label, kind: isMech?'mechanical':'rooms', rooms:[] };
  if(isMech){
    lvl.rooms = [mkMechItem('Electrical panel'), mkMechItem('Furnace'), mkMechItem('Air conditioner'),
                 mkMechItem('Water heater'), mkMechItem(''), mkMechItem('')];
  } else {
    lvl.safety = { smoke:{present:null, photos:[]}, co:{present:null, photos:[]}, combo:{present:null, photos:[]} };
    if(label==='L1' || label==='L2'){
      lvl.rooms = [mkRoom('Living room'), mkRoom('Dining room'), mkRoom('Kitchen')];
    }
  }
  return lvl;
}

function findProp(id){ return properties.find(p=>p.id===id); }
function findLevel(p, levelId){ return p.levels.find(l=>l.id===levelId); }
function findRoomAnyLevel(p, roomId){
  for(const lvl of p.levels){ const r=(lvl.rooms||[]).find(x=>x.id===roomId); if(r) return r; }
  return null;
}
function levelSortKey(label){
  // Fixed order regardless of which order levels were actually added in:
  // L-levels first (L1, L2, L3...), then B-levels (B1, B2...), then anything else.
  const m = /^([A-Za-z]+)(\d+)$/.exec(label||'');
  if(m){
    const prefix = m[1].toUpperCase();
    const num = parseInt(m[2],10);
    const prefixRank = prefix==='L' ? 0 : (prefix==='B' ? 1 : 2);
    return [prefixRank, num];
  }
  return [3, 0];
}
function orderedRoomLevels(p){
  return p.levels.filter(l=>l.kind==='rooms').slice().sort((a,b)=>{
    const ka=levelSortKey(a.label), kb=levelSortKey(b.label);
    return (ka[0]-kb[0]) || (ka[1]-kb[1]);
  });
}
function nextBedroomNumber(p){
  // One running count across the whole property, in fixed level order -
  // not tied to which order you actually visited levels in the field.
  let count = 0;
  orderedRoomLevels(p).forEach(lvl=>{
    lvl.rooms.forEach(r=>{ if(/^Bedroom(\s+\d+)?$/i.test(r.name||'')) count++; });
  });
  return count+1;
}
function uniqueNameForLevel(level, pickedName, currentRoomId){
  // Guarantees no two rooms on the same level ever end up with the exact same
  // name - which is what was silently overwriting photos in the ZIP before.
  const existing = level.rooms.filter(r=>r.id!==currentRoomId).map(r=>r.name);
  if(!existing.includes(pickedName)) return pickedName;
  let n=2;
  while(existing.includes(pickedName+' '+n)) n++;
  return pickedName+' '+n;
}
function roomNameCategory(name){
  // Maps a stored name like "Bedroom 2" or "Bathroom 2" back to its base
  // dropdown option ("Bedroom", "Bathroom"), so the <select> shows the right
  // thing even though the actual stored name has a number appended.
  for(const opt of ROOM_NAME_OPTIONS.slice(0,-1)){
    if(name === opt) return opt;
    const esc = opt.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if(new RegExp('^'+esc+'\\s+\\d+$','i').test(name||'')) return opt;
  }
  return 'Other';
}
function uniqueMechLabel(level, pickedLabel, currentItemId){
  const existing = level.rooms.filter(m=>m.id!==currentItemId).map(m=>m.label);
  if(!pickedLabel || !existing.includes(pickedLabel)) return pickedLabel;
  let n=2;
  while(existing.includes(pickedLabel+' '+n)) n++;
  return pickedLabel+' '+n;
}

function countExteriorDone(p){
  let total = EXTERIOR_TILES.length + 1;
  let done = 0;
  EXTERIOR_TILES.forEach(([k])=>{ if((p.exterior.photos[k]||[]).length>0) done++; });
  if(p.exterior.outbuildingPresent===false || (p.exterior.outbuildingPresent && p.exterior.outbuildingPhotos.length>0)) done++;
  return done+'/'+total;
}
function countRoomsLabel(p){
  const roomLevels = p.levels.filter(l=>l.kind==='rooms');
  const roomCount = roomLevels.reduce((sum,l)=>sum+l.rooms.length,0);
  return p.levels.length + ' level' + (p.levels.length===1?'':'s') + ' \u2022 ' + roomCount + ' room' + (roomCount===1?'':'s');
}

/* ---------- Image compression ---------- */
function fileToCompressedDataURL(file, maxDim=1600, quality=0.75){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function dataURLtoBlob(dataURL){
  const [meta, b64] = dataURL.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
function sanitize(s){ return (s||'').replace(/[\\/:*?"<>|]/g,'-').trim(); }

const ADDRESS_DIRECTION_ABBR = {
  north:'N', south:'S', east:'E', west:'W',
  northeast:'NE', northwest:'NW', southeast:'SE', southwest:'SW'
};
const ADDRESS_SUFFIX_ABBR = {
  avenue:'Ave', boulevard:'Blvd', street:'St', drive:'Dr', road:'Rd', lane:'Ln',
  court:'Ct', circle:'Cir', place:'Pl', terrace:'Ter', parkway:'Pkwy', highway:'Hwy',
  trail:'Trl', crossing:'Xing', square:'Sq', point:'Pt', ridge:'Rdg', crescent:'Cres',
  loop:'Loop', way:'Way', run:'Run', bend:'Bend', cove:'Cv', pass:'Pass', alley:'Aly',
  path:'Path', pike:'Pike', walk:'Walk'
};
function shortenAddressForFilename(address){
  // Trims to just the street-address portion (drops city/state/zip after the
  // first comma) and abbreviates directions and street suffixes, so filenames
  // stay short and easy to work with - e.g. "2328 West Euclid Avenue, Spokane,
  // WA 99205" -> "2328 W Euclid Ave"
  if(!address) return address;
  const streetPart = address.split(',')[0].trim();
  const words = streetPart.split(/\s+/);
  const out = words.map((w, i)=>{
    const bare = w.replace(/[.,]/g,'');
    const lower = bare.toLowerCase();
    if(ADDRESS_DIRECTION_ABBR[lower]) return ADDRESS_DIRECTION_ABBR[lower];
    if(i === words.length-1 && ADDRESS_SUFFIX_ABBR[lower]) return ADDRESS_SUFFIX_ABBR[lower];
    return w;
  });
  return out.join(' ');
}

/* ---------- Save/load ---------- */
async function saveCurrent(){ const p = findProp(currentPropId); if(p) await dbPut(p); }
function migratePropertyPhotos(p){
  // Old data stored photos as plain strings; new data stores {src, takenAt}.
  // This brings old properties up to the new shape without losing anything -
  // old photos just won't have a real "taken at" time (they'll fall back to
  // the export date, since we never captured one for them originally).
  let changed = false;
  const fix = (arr)=>{
    if(!Array.isArray(arr)) return;
    for(let i=0;i<arr.length;i++){
      if(typeof arr[i] === 'string'){ arr[i] = { src: arr[i], takenAt: null }; changed = true; }
    }
  };
  if(p.exterior){
    Object.keys(p.exterior.photos||{}).forEach(k=>fix(p.exterior.photos[k]));
    fix(p.exterior.outbuildingPhotos);
    if(p.exterior.fence){ fix(p.exterior.fence.front && p.exterior.fence.front.photos); fix(p.exterior.fence.rear && p.exterior.fence.rear.photos); }
    if(p.exterior.features){ Object.keys(p.exterior.features).forEach(k=>fix(p.exterior.features[k].photos)); }
    if(p.exterior.driveway) fix(p.exterior.driveway.photos);
    if(p.exterior.garage){ fix(p.exterior.garage.exteriorPhotos); fix(p.exterior.garage.interiorPhotos); }
    if(p.exterior.sprinkler) fix(p.exterior.sprinkler.photos);
  }
  (p.levels||[]).forEach(lvl=>{
    if(lvl.kind==='mechanical'){
      (lvl.rooms||[]).forEach(item=>fix(item.photos));
    } else {
      if(lvl.safety){
        if(!lvl.safety.combo){ lvl.safety.combo = {present:null, photos:[]}; changed = true; }
        fix(lvl.safety.smoke && lvl.safety.smoke.photos);
        fix(lvl.safety.co && lvl.safety.co.photos);
        fix(lvl.safety.combo && lvl.safety.combo.photos);
      }
      (lvl.rooms||[]).forEach(r=>{ fix(r.roomPhotos); fix(r.flooringPhotos); });
    }
  });
  return changed;
}
async function loadAll(){
  properties = await dbGetAll();
  properties.sort((a,b)=>a.createdAt-b.createdAt);
  for(const p of properties){
    if(migratePropertyPhotos(p)) await dbPut(p);
  }
}

/* ---------- Toast ---------- */
function toast(msg, ms){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), ms || 2000);
}

/* ---------- Tap a thumbnail to view it full-screen, with delete right there ---------- */
function openPhotoViewer(imgEl){
  const src = imgEl.src, key = imgEl.dataset.key, idx = imgEl.dataset.idx;
  const tileCard = imgEl.closest('.card');
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:20px;gap:16px;';
  overlay.innerHTML = `
    <img src="${src}" style="max-width:100%;max-height:70vh;border-radius:8px;object-fit:contain;">
    <div style="display:flex;gap:12px;">
      <button class="btn" id="viewerClose">Close</button>
      <button class="btn" id="viewerDelete" style="background:var(--danger);border-color:var(--danger);color:#fff;">Delete photo</button>
    </div>
  `;
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  document.body.appendChild(overlay);
  overlay.querySelector('#viewerClose').onclick = ()=>overlay.remove();
  overlay.querySelector('#viewerDelete').onclick = ()=>{
    overlay.remove();

/* ---------- Custom modal dialogs (native prompt/confirm aren't reliable in every embedded browser) ---------- */
function showModal(innerHTML){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;';
  overlay.innerHTML = `<div class="card" style="max-width:400px;width:100%;margin:0;">${innerHTML}</div>`;
  document.body.appendChild(overlay);
  return overlay;
}
function askText(title, placeholder, onOk){
  const overlay = showModal(`
    <p class="label">${title}</p>
    <input type="text" id="modalInput" placeholder="${placeholder||''}" style="margin-top:10px;">
    <div class="row" style="margin-top:14px;gap:10px;">
      <button class="btn" id="modalCancel" style="flex:1;">Cancel</button>
      <button class="btn btn-accent" id="modalOk" style="flex:1;">OK</button>
    </div>
  `);
  const input = overlay.querySelector('#modalInput');
  setTimeout(()=>input.focus(), 50);
  overlay.querySelector('#modalCancel').onclick = ()=>overlay.remove();
  overlay.querySelector('#modalOk').onclick = ()=>{ const v=input.value; overlay.remove(); onOk(v); };
  input.onkeydown = (e)=>{ if(e.key==='Enter'){ const v=input.value; overlay.remove(); onOk(v); } };
}
function askConfirm(title, message, onYes){
  const overlay = showModal(`
    <p class="label">${title}</p>
    <p class="sub" style="margin-top:6px;">${message||''}</p>
    <div class="row" style="margin-top:14px;gap:10px;">
      <button class="btn" id="modalCancel" style="flex:1;">Cancel</button>
      <button class="btn" id="modalYes" style="flex:1;background:var(--danger);border-color:var(--danger);color:#fff;">Confirm</button>
    </div>
  `);
  overlay.querySelector('#modalCancel').onclick = ()=>overlay.remove();
  overlay.querySelector('#modalYes').onclick = ()=>{ overlay.remove(); onYes(); };
}

function formatAppt(iso){
  if(!iso) return '';
  try{
    const d = new Date(iso);
    return d.toLocaleString(undefined, {weekday:'short', month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit'});
  }catch(e){ return iso; }
}

/* ---------- New property / edit property details, with online-only address autocomplete ---------- */
const US_STATE_ABBR = {
  'Alabama':'AL','Alaska':'AK','Arizona':'AZ','Arkansas':'AR','California':'CA','Colorado':'CO',
  'Connecticut':'CT','Delaware':'DE','Florida':'FL','Georgia':'GA','Hawaii':'HI','Idaho':'ID',
  'Illinois':'IL','Indiana':'IN','Iowa':'IA','Kansas':'KS','Kentucky':'KY','Louisiana':'LA',
  'Maine':'ME','Maryland':'MD','Massachusetts':'MA','Michigan':'MI','Minnesota':'MN','Mississippi':'MS',
  'Missouri':'MO','Montana':'MT','Nebraska':'NE','Nevada':'NV','New Hampshire':'NH','New Jersey':'NJ',
  'New Mexico':'NM','New York':'NY','North Carolina':'NC','North Dakota':'ND','Ohio':'OH','Oklahoma':'OK',
  'Oregon':'OR','Pennsylvania':'PA','Rhode Island':'RI','South Carolina':'SC','South Dakota':'SD',
  'Tennessee':'TN','Texas':'TX','Utah':'UT','Vermont':'VT','Virginia':'VA','Washington':'WA',
  'West Virginia':'WV','Wisconsin':'WI','Wyoming':'WY','District of Columbia':'DC'
};
function formatShortAddress(addr){
  const street = [addr.house_number, addr.road].filter(Boolean).join(' ');
  const city = addr.city || addr.town || addr.village || addr.hamlet || '';
  const stateAbbr = US_STATE_ABBR[addr.state] || addr.state || '';
  const parts = [];
  if(street) parts.push(street);
  if(city) parts.push(city);
  const stateZip = [stateAbbr, addr.postcode].filter(Boolean).join(' ');
  if(stateZip) parts.push(stateZip);
  return parts.join(', ');
}
function askPropertyDetails(existing, onOk){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;';
  const esc = (s)=> (s||'').replace(/"/g,'&quot;');
  overlay.innerHTML = `<div class="card" style="max-width:440px;width:100%;margin:0;max-height:85vh;overflow-y:auto;">
    <p class="label">${existing ? 'Edit property details' : 'New property'}</p>

    <p class="fieldhead">Address</p>
    <input type="text" id="npAddress" value="${existing?esc(existing.address):''}" placeholder="Start typing..." autocomplete="off">
    <div id="npSuggestions" style="margin-top:6px;display:flex;flex-direction:column;gap:6px;"></div>
    <p class="hint" id="npAddrHint" style="display:none;">Suggestions need Wi-Fi \u2014 typing still works fine offline.</p>

    <p class="fieldhead">Appointment date & time</p>
    <input type="datetime-local" id="npAppt" value="${existing&&existing.appointment?existing.appointment:''}" style="width:100%;font-size:17px;font-family:inherit;border:2px solid var(--line);border-radius:12px;padding:12px;min-height:48px;">

    <p class="fieldhead">Effective date</p>
    <input type="date" id="npEffective" value="${existing&&existing.effectiveDate?existing.effectiveDate:''}" style="width:100%;font-size:17px;font-family:inherit;border:2px solid var(--line);border-radius:12px;padding:12px;min-height:48px;">

    <p class="fieldhead">Occupied or vacant?</p>
    <div class="chiprow">
      <button class="chip ${existing&&existing.occupancy==='Occupied'?'selected':''}" data-occ="Occupied">Occupied</button>
      <button class="chip ${existing&&existing.occupancy==='Vacant'?'selected':''}" data-occ="Vacant">Vacant</button>
    </div>

    <p class="fieldhead">File number</p>
    <input type="text" id="npFileNum" value="${existing?esc(existing.fileNumber||''):''}" placeholder="Optional">

    <div class="row" style="margin-top:14px;gap:10px;">
      <button class="btn" id="modalCancel" style="flex:1;">Cancel</button>
      <button class="btn btn-accent" id="modalOk" style="flex:1;">${existing?'Save':'Create'}</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  const addrInput = overlay.querySelector('#npAddress');
  const sugBox = overlay.querySelector('#npSuggestions');
  const addrHint = overlay.querySelector('#npAddrHint');
  setTimeout(()=>addrInput.focus(), 50);

  let occupancy = existing ? (existing.occupancy||null) : null;
  overlay.querySelectorAll('[data-occ]').forEach(btn=>{
    btn.onclick = ()=>{
      occupancy = (occupancy===btn.dataset.occ) ? null : btn.dataset.occ;
      overlay.querySelectorAll('[data-occ]').forEach(b=>b.classList.toggle('selected', b.dataset.occ===occupancy));
    };
  });

  let debounceTimer=null;
  addrInput.oninput = ()=>{
    clearTimeout(debounceTimer);
    const q = addrInput.value.trim();
    sugBox.innerHTML = '';
    if(q.length<4) { addrHint.style.display='none'; return; }
    if(!navigator.onLine){ addrHint.style.display='block'; return; }
    addrHint.style.display='none';
    debounceTimer = setTimeout(async ()=>{
      try{
        const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&countrycodes=us&viewbox=-124.85,49.05,-116.9,45.5&bounded=0&q='+encodeURIComponent(q));
        const data = await res.json();
        const formatted = data.map(d=>formatShortAddress(d.address||{}));
        // Only ever show/use the cleanly-formatted version - never fall back to
        // Nominatim's raw display_name, which can include neighborhood/county/
        // country junk. If a result can't be cleanly formatted, skip it rather
        // than show something messy.
        const validIdx = data.map((d,i)=>i).filter(i=>formatted[i]);
        sugBox.innerHTML = validIdx.map(i=>`<button type="button" class="btn btn-sm" data-sugidx="${i}" style="text-align:left;">${formatted[i]}</button>`).join('');
        sugBox.querySelectorAll('[data-sugidx]').forEach(b=>{
          b.onclick = ()=>{ addrInput.value = formatted[parseInt(b.dataset.sugidx,10)]; sugBox.innerHTML=''; };
        });
      }catch(e){ /* offline or blocked - plain typing still works, fail silently */ }
    }, 450);
  };

  overlay.querySelector('#modalCancel').onclick = ()=>overlay.remove();
  overlay.querySelector('#modalOk').onclick = ()=>{
    const data = {
      address: addrInput.value.trim(),
      appointment: overlay.querySelector('#npAppt').value || null,
      effectiveDate: overlay.querySelector('#npEffective').value || null,
      occupancy: occupancy,
      fileNumber: overlay.querySelector('#npFileNum').value.trim()
    };
    overlay.remove();
    onOk(data);
  };
}

/* ---------- Tap vs. long-press helper ---------- */
function bindTapHold(el, onTap, onHold, holdMs){
  holdMs = holdMs || 550;
  let timer=null, firedHold=false;
  const start=()=>{ firedHold=false; timer=setTimeout(()=>{ firedHold=true; onHold(); }, holdMs); };
  const clearTimer=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  const end=()=>{ clearTimer(); if(!firedHold) onTap(); };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointerleave', clearTimer);
  el.addEventListener('pointercancel', clearTimer);
}

/* ---------- Tap to select, fast double-tap on the same chip to clear ---------- */
function bindSingleSelectTap(el, getCurrent, val, onSet){
  el.onclick = ()=>{
    if(getCurrent()!==val){ onSet(val); return; }
    const now = Date.now();
    const last = el._lastTapTime || 0;
    el._lastTapTime = now;
    if(now - last < 400){ el._lastTapTime = 0; onSet(null); }
  };
}
function bindAddRemoveTap(el, isSelected, onAdd, onRemove){
  el.onclick = ()=>{
    if(!isSelected()){ onAdd(); return; }
    const now = Date.now();
    const last = el._lastTapTime || 0;
    el._lastTapTime = now;
    if(now - last < 400){ el._lastTapTime = 0; onRemove(); }
  };
}

  });

  });
  app.querySelectorAll('[data-delprop]').forEach(btn=>{
    btn.onclick = ()=>{
      const p = findProp(btn.dataset.delprop);
      askConfirm('Delete this property?', (p.address||'This property') + ' will be removed for good. This cannot be undone.', async ()=>{
        await dbDelete(btn.dataset.delprop);

  const typeChips = typeOptions.map(v=>`<button class="chip ${data.type===v?'selected':''}" data-feattype="${key}" data-val="${v}">${v}</button>`).join('');
  const matChips = materialOptions.map(v=>`<button class="chip ${data.materials.includes(v)?'selected':''}" data-featmat="${key}" data-val="${v}">${v}</button>`).join('');
  return `
    <div class="card">
      <div class="row" style="align-items:flex-start;">
        <div style="flex:1;">
          <p class="label">${label} present?</p>
          <div class="chiprow">
            <button class="chip ${data.present===true?'selected':''}" data-featpresent="${key}" data-val="yes">Yes</button>
            <button class="chip ${data.present===false?'selected':''}" data-featpresent="${key}" data-val="no">No</button>
          </div>
        </div>
        ${data.present ? `<div style="flex:1;">${photoTileHTML(key+'_photo', label+' photo', data.photos)}</div>` : ''}
      </div>
      ${data.present ? `
        <p class="fieldhead">Type</p>
        <div class="chiprow">${typeChips}</div>
        <p class="fieldhead">Material</p>
        <p class="sub">Tap all that apply</p>
        <div class="chiprow">${matChips}</div>
      ` : ''}
    </div>`;
}

/* ---------- Render: Interior (levels: rooms + mechanical) ---------- */
function renderRooms(){
  const p = findProp(currentPropId);
  const app = document.getElementById('app');

  const safetyDetectorRow = (lvl, key, label)=>{
    const det = lvl.safety[key];
    return `
      <div class="row" style="align-items:flex-start;margin-top:10px;">
        <div style="flex:1;">
          <p class="label" style="font-size:17px;margin:0;">${label}</p>
          <div class="chiprow">
            <button class="chip ${det.present===true?'selected':''}" data-det="${lvl.id}|${key}" data-val="yes">Yes</button>
            <button class="chip ${det.present===false?'selected':''}" data-det="${lvl.id}|${key}" data-val="no">No</button>
          </div>
        </div>
        <div style="flex:1;">${photoTileHTML('det_'+lvl.id+'_'+key, label+' photo', det.photos)}</div>
      </div>
    `;
  };

  const roomCardHTML = (r, idx)=>{
    const roomCategory = roomNameCategory(r.name);
    const showOtherBox = (roomCategory === 'Other') || (r.name !== roomCategory);
    const nameOpts = ROOM_NAME_OPTIONS.map(n=>`<option value="${n}" ${n===roomCategory?'selected':''}>${n}</option>`).join('');
    const ceilChips = CEILING_HEIGHT_OPTIONS.map(v=>`<button class="chip ${r.ceilingHeight===v?'selected':''}" data-ceil="${r.id}" data-ceilval="${v}">${v}</button>`).join('');
    const styleChips = CEILING_STYLE_OPTIONS.map(v=>`<button class="chip ${r.ceilingStyle===v?'selected':''}" data-style="${r.id}" data-styleval="${v}">${v}</button>`).join('');
    const condChips = CONDITION_OPTIONS.map(v=>`<button class="chip ${r.condition===v?'selected':''}" data-cond="${r.id}" data-condval="${v}">${v}</button>`).join('');
    const floorChips = FLOORING_OPTIONS.map(v=>`<button class="chip ${r.flooringType===v?'selected':''}" data-floor="${r.id}" data-floorval="${v}">${v}</button>`).join('');
    const updatedBlock = isKitchenOrBath(r.name) ? `
      <p class="fieldhead">Updated?</p>
      <div class="chiprow">
        <button class="chip ${r.updated.yesNo===true?'selected':''}" data-updyn="${r.id}" data-val="yes">Yes</button>
        <button class="chip ${r.updated.yesNo===false?'selected':''}" data-updyn="${r.id}" data-val="no">No</button>
      </div>
      ${r.updated.yesNo ? `
        <input type="text" data-updwhat="${r.id}" value="${(r.updated.what||'').replace(/"/g,'&quot;')}" placeholder="What was updated (e.g. Appliances)" style="margin-top:8px;">
        <div class="chiprow">
          ${UPDATED_TIMEFRAMES.map(v=>`<button class="chip ${r.updated.when===v?'selected':''}" data-updwhen="${r.id}" data-val="${v}">${v}</button>`).join('')}
        </div>
      ` : ''}
    ` : '';
    return `
    <div class="roomcard ${idx % 2 === 1 ? 'alt' : ''}" data-roomid="${r.id}">
      <div class="row" style="align-items:flex-start;gap:12px;">
        <div style="flex:1;">
          <select data-roomselect="${r.id}" class="room-name-select" style="width:100%;font-weight:700;font-size:19px;">${nameOpts}</select>
          ${showOtherBox ? `<input type="text" data-roomcustom="${r.id}" value="${r.name==='Other'?'':r.name}" placeholder="Type room name" style="margin-top:8px;">` : ''}
          <button class="btn btn-sm" data-delroom="${r.id}" style="margin-top:8px;">Remove</button>
        </div>
        <div style="flex:1;">
          ${photoTileHTML('room_'+r.id, 'Photo of room', r.roomPhotos)}
        </div>
      </div>

      <p class="fieldhead">Flooring type</p>
      <div class="chiprow">${floorChips}</div>
      ${photoTileHTML('floor_'+r.id, 'Flooring photo', r.flooringPhotos)}

      <p class="fieldhead">Ceiling height</p>
      <p class="sub">Measured at highest point &mdash; nearest foot (UAD 3.6)</p>
      <div class="chiprow">${ceilChips}</div>

      <p class="fieldhead">Ceiling style</p>
      <div class="chiprow">${styleChips}</div>

      <p class="fieldhead">Condition</p>
      <div class="chiprow">${condChips}</div>

      ${updatedBlock}

      <p class="fieldhead">Notes</p>
      <textarea data-roomnotes="${r.id}" placeholder="Anything specific to this room...">${r.notes||''}</textarea>
    </div>`;
  };

  const mechCardHTML = (item)=>{
    const lbl = (item.label||'').trim().toLowerCase();
    const isWaterHeater = lbl==='water heater';
    const isFurnace = lbl==='furnace';
    return `
    <div class="mechcard" data-mechid="${item.id}">
      <div class="row">
        <input type="text" data-mechlabel="${item.id}" value="${item.label}" placeholder="Label this photo (e.g. Water softener)">
        <button class="btn btn-sm" data-delmech="${item.id}">Remove</button>
      </div>
      ${photoTileHTML('mech_'+item.id, item.label || 'Photo', item.photos)}
      ${isFurnace ? `
        <p class="fieldhead">Fuel type</p>
        <div class="chiprow">
          ${FURNACE_FUELS.map(v=>`<button class="chip ${item.fuelType===v?'selected':''}" data-fuel="${item.id}" data-val="${v}">${v}</button>`).join('')}
        </div>
      ` : ''}
      ${isWaterHeater ? `
        <p class="fieldhead">Fuel type</p>
        <div class="chiprow">
          ${WATER_HEATER_FUELS.map(v=>`<button class="chip ${item.fuelType===v?'selected':''}" data-fuel="${item.id}" data-val="${v}">${v}</button>`).join('')}
        </div>
        <div class="row" style="margin-top:4px;">
          <p class="label" style="font-size:17px;">Water heater strapped?</p>
          <div class="chiprow" style="margin-top:0;">
            <button class="chip ${item.strapped===true?'selected':''}" data-strap="${item.id}" data-val="yes">Yes</button>
            <button class="chip ${item.strapped===false?'selected':''}" data-strap="${item.id}" data-val="no">No</button>
          </div>
        </div>
        <p class="hint">Hold a button down to clear it.</p>
      ` : ''}
    </div>`;
  };

  const activeLevel = p.levels.find(l=>l.id===currentTab);

  const levelHTML = !activeLevel ? `
    <div class="card">
      <p class="label">No level selected</p>
      <p class="sub">Tap "+ Level" up in the tab bar to add L1, B1, a mechanical area, or a custom level.</p>
    </div>
  ` : (activeLevel.kind==='mechanical' ? `
      <div class="levelcard" data-levelid="${activeLevel.id}">
        <div class="levelhead">
          <p class="label">${activeLevel.label}</p>
          <button class="btn btn-sm" data-dellevel="${activeLevel.id}">Remove</button>
        </div>
        ${activeLevel.rooms.map(mechCardHTML).join('')}
        <button class="btn btn-accent" data-addmech="${activeLevel.id}" style="width:100%;">+ Add item to ${activeLevel.label}</button>
      </div>` : `
    <div class="levelcard" data-levelid="${activeLevel.id}">
      <div class="levelhead">
        <p class="label">${activeLevel.label}</p>
        <button class="btn btn-sm" data-dellevel="${activeLevel.id}">Remove level</button>
      </div>
      <div class="safetyblock">
        <p class="label" style="font-size:18px;">Smoke & CO detectors &mdash; required every level</p>
        ${safetyDetectorRow(activeLevel,'smoke','Smoke detector present')}
        ${safetyDetectorRow(activeLevel,'co','CO detector present')}
        ${safetyDetectorRow(activeLevel,'combo','Combo unit present')}
        <p class="hint">Combo Yes auto-confirms Smoke and CO too. Hold Combo to clear it \u2014 that also resets Smoke and CO, so nothing stays marked done without you actually confirming it.</p>
      </div>
      ${activeLevel.rooms.map((r,idx)=>roomCardHTML(r,idx)).join('')}
      <button class="btn btn-accent" data-addroom="${activeLevel.id}" style="width:100%;">+ Add room to ${activeLevel.label}</button>
    </div>`);

  app.innerHTML = `
    ${propertyChromeHTML(p)}
    <div class="content">
      ${levelHTML}
    </div>
  `;
  wirePropertyChrome(app, p);

  app.querySelectorAll('[data-det]').forEach(btn=>{
    const [levelId,key] = btn.dataset.det.split('|');
    const val = (btn.dataset.val==='yes');
    bindTapHold(btn,
      ()=>{
        const lvl = findLevel(p,levelId);
        lvl.safety[key].present = val;
        if(key==='combo' && val===true){
          lvl.safety.smoke.present = true;
          lvl.safety.co.present = true;
        }
        saveCurrent(); renderRooms();
      },
      ()=>{
        const lvl = findLevel(p,levelId);
        lvl.safety[key].present = null;
        if(key==='combo'){
          lvl.safety.smoke.present = null;
          lvl.safety.co.present = null;
        }
        saveCurrent(); toast('Cleared.'); renderRooms();
      }
    );
  });
  p.levels.filter(l=>l.kind==='rooms').forEach(lvl=>{
    wirePhotoTile(app, 'det_'+lvl.id+'_smoke', ()=>lvl.safety.smoke.photos, renderRooms);
    wirePhotoTile(app, 'det_'+lvl.id+'_co', ()=>lvl.safety.co.photos, renderRooms);
    wirePhotoTile(app, 'det_'+lvl.id+'_combo', ()=>lvl.safety.combo.photos, renderRooms);
  });

  app.querySelectorAll('[data-dellevel]').forEach(btn=>{
    btn.onclick = ()=>{
      askConfirm('Remove this level?', 'Everything inside it goes too.', ()=>{
        p.levels = p.levels.filter(l=>l.id!==btn.dataset.dellevel);

        if(currentTab === btn.dataset.dellevel) currentTab = 'exterior';
        renderCurrentTab();
      });
    };
  });

  app.querySelectorAll('[data-addroom]').forEach(btn=>{
    btn.onclick = ()=>{ findLevel(p,btn.dataset.addroom).rooms.push(mkRoom('')); saveCurrent(); renderRooms(); };
  });
  app.querySelectorAll('[data-delroom]').forEach(btn=>{
    btn.onclick = ()=>{
      askConfirm('Remove this room?', '', ()=>{
        p.levels.forEach(lvl=>{ if(lvl.kind==='rooms') lvl.rooms = lvl.rooms.filter(r=>r.id!==btn.dataset.delroom); });
        saveCurrent(); renderRooms();
      });
    };
  });
  app.querySelectorAll('[data-roomselect]').forEach(sel=>{
    sel.onchange = ()=>{
      const r = findRoomAnyLevel(p, sel.dataset.roomselect);
      const lvl = p.levels.find(l=> l.kind==='rooms' && l.rooms.some(x=>x.id===r.id));
      let picked = sel.value;
      if(picked === 'Bedroom'){
        r.name = 'Bedroom ' + nextBedroomNumber(p);
      } else if(picked === 'Other'){
        r.name = 'Other';
      } else {
        r.name = uniqueNameForLevel(lvl, picked, r.id);
      }
      saveCurrent(); renderRooms();
    };
  });
  app.querySelectorAll('[data-roomcustom]').forEach(inp=>{
    inp.onblur = ()=>{
      const r=findRoomAnyLevel(p,inp.dataset.roomcustom);
      if(inp.value.trim()){
        const lvl = p.levels.find(l=> l.kind==='rooms' && l.rooms.some(x=>x.id===r.id));
        r.name = uniqueNameForLevel(lvl, inp.value.trim(), r.id);
      }
      saveCurrent();
    };
  });
  app.querySelectorAll('[data-roomnotes]').forEach(ta=>{
    ta.onblur = ()=>{ findRoomAnyLevel(p,ta.dataset.roomnotes).notes = ta.value; saveCurrent(); };
  });
  app.querySelectorAll('[data-ceil]').forEach(btn=>{
    const r = findRoomAnyLevel(p,btn.dataset.ceil);
    bindSingleSelectTap(btn, ()=>r.ceilingHeight, btn.dataset.ceilval, (v)=>{ r.ceilingHeight=v; saveCurrent(); renderRooms(); });
  });
  app.querySelectorAll('[data-style]').forEach(btn=>{
    const r = findRoomAnyLevel(p,btn.dataset.style);
    bindSingleSelectTap(btn, ()=>r.ceilingStyle, btn.dataset.styleval, (v)=>{ r.ceilingStyle=v; saveCurrent(); renderRooms(); });
  });
  app.querySelectorAll('[data-cond]').forEach(btn=>{
    const r = findRoomAnyLevel(p,btn.dataset.cond);
    bindSingleSelectTap(btn, ()=>r.condition, btn.dataset.condval, (v)=>{ r.condition=v; saveCurrent(); renderRooms(); });
  });
  app.querySelectorAll('[data-floor]').forEach(btn=>{
    const r = findRoomAnyLevel(p,btn.dataset.floor);
    bindSingleSelectTap(btn, ()=>r.flooringType, btn.dataset.floorval, (v)=>{ r.flooringType=v; saveCurrent(); renderRooms(); });
  });
  app.querySelectorAll('[data-updyn]').forEach(btn=>{
    const r = findRoomAnyLevel(p,btn.dataset.updyn);
    const v = (btn.dataset.val==='yes');
    bindSingleSelectTap(btn, ()=>r.updated.yesNo, v, (val)=>{ r.updated.yesNo=val; saveCurrent(); renderRooms(); });
  });
  app.querySelectorAll('[data-updwhat]').forEach(inp=>{
    inp.onblur = ()=>{ findRoomAnyLevel(p,inp.dataset.updwhat).updated.what = inp.value; saveCurrent(); };
  });
  app.querySelectorAll('[data-updwhen]').forEach(btn=>{
    const r = findRoomAnyLevel(p,btn.dataset.updwhen);
    bindSingleSelectTap(btn, ()=>r.updated.when, btn.dataset.val, (v)=>{ r.updated.when=v; saveCurrent(); renderRooms(); });
  });
  p.levels.filter(l=>l.kind==='rooms').forEach(lvl=>{
    lvl.rooms.forEach(r=>{
      wirePhotoTile(app, 'room_'+r.id, ()=>r.roomPhotos, renderRooms);
      wirePhotoTile(app, 'floor_'+r.id, ()=>r.flooringPhotos, renderRooms);
    });
  });

  app.querySelectorAll('[data-addmech]').forEach(btn=>{
    btn.onclick = ()=>{ findLevel(p,btn.dataset.addmech).rooms.push(mkMechItem('')); saveCurrent(); renderRooms(); };
  });
  app.querySelectorAll('[data-delmech]').forEach(btn=>{
    btn.onclick = ()=>{
      askConfirm('Remove this item?', '', ()=>{
        p.levels.forEach(lvl=>{ if(lvl.kind==='mechanical') lvl.rooms = lvl.rooms.filter(m=>m.id!==btn.dataset.delmech); });
        saveCurrent(); renderRooms();
      });
    };
  });
  app.querySelectorAll('[data-mechlabel]').forEach(inp=>{
    inp.onblur = ()=>{
      const lvl = p.levels.find(l=>l.kind==='mechanical' && l.rooms.some(m=>m.id===inp.dataset.mechlabel));
      const item = lvl.rooms.find(m=>m.id===inp.dataset.mechlabel);
      item.label = uniqueMechLabel(lvl, inp.value.trim(), item.id);
      saveCurrent(); renderRooms();
    };
  });
  app.querySelectorAll('[data-strap]').forEach(btn=>{
    const itemId = btn.dataset.strap, val = (btn.dataset.val==='yes');
    const lvl = p.levels.find(l=>l.kind==='mechanical' && l.rooms.some(m=>m.id===itemId));
    const item = lvl.rooms.find(m=>m.id===itemId);
    bindTapHold(btn,
      ()=>{ item.strapped = val; saveCurrent(); renderRooms(); },
      ()=>{ item.strapped = null; saveCurrent(); toast('Cleared.'); renderRooms(); }

  app.querySelectorAll('[data-fuel]').forEach(btn=>{
    const itemId = btn.dataset.fuel;
    const lvl = p.levels.find(l=>l.kind==='mechanical' && l.rooms.some(m=>m.id===itemId));
    const item = lvl.rooms.find(m=>m.id===itemId);
    bindSingleSelectTap(btn, ()=>item.fuelType, btn.dataset.val, (v)=>{ item.fuelType=v; saveCurrent(); renderRooms(); });
  });
  p.levels.filter(l=>l.kind==='mechanical').forEach(lvl=>{
    lvl.rooms.forEach(item=>{ wirePhotoTile(app, 'mech_'+item.id, ()=>item.photos, renderRooms); });
  });
}

/* ---------- Export ---------- */
function buildNotesText(p){
  const f = v => v===true?'Yes':(v===false?'No':null);
  let lines = [];
  const put = (label, val) => { if(val!==null && val!==undefined && val!=='') lines.push('- **' + label + ':** ' + val); };

  lines.push('# Field Notes \u2014 ' + p.address);
  lines.push('');
  put('File number', p.fileNumber);
  put('Inspection date/time', p.appointment ? formatAppt(p.appointment) : null);
  put('Effective date', p.effectiveDate);
  put('Occupancy', p.occupancy);
  lines.push('');
  lines.push('## Exterior');
  lines.push('');
  const found = p.exterior.foundation;
  if(found.materials.length || found.types.length || found.condition){
    put('Foundation', [found.materials.join(', '), found.types.join(', '), found.condition].filter(Boolean).join(' \u2014 '));
  }
  EXTERIOR_COMPONENTS.forEach(([key,label])=>{
    const c = p.exterior.components[key];
    const parts = [...c.types, c.condition].filter(Boolean);
    if(parts.length) put(label, parts.join(', '));
  });
  put('Entrance height above grade', p.exterior.entranceHeight);
  put('Outbuilding present', f(p.exterior.outbuildingPresent));
  ['front','rear'].forEach(side=>{
    const fen = p.exterior.fence[side];
    if(fen.present){
      put((side==='front'?'Front':'Rear') + ' fence', fen.materials.join(', ') || '(material not set)');
    } else if(fen.present===false){
      put((side==='front'?'Front':'Rear') + ' fence', 'None');
    }
  });
  EXTERIOR_FEATURES.forEach(([key,label])=>{
    const feat = p.exterior.features[key];
    if(feat.present){
      put(label, [feat.type, feat.materials.join(', ')].filter(Boolean).join(' \u2014 ') || '(details not set)');
    } else if(feat.present===false){
      put(label, 'None');
    }
  });
  const dw = p.exterior.driveway;
  if(dw.present){
    put('Driveway', [dw.materials.join(', '), dw.capacity?dw.capacity+' car':null].filter(Boolean).join(' \u2014 ') || '(details not set)');
  } else if(dw.present===false){
    put('Driveway', 'None');
  }
  const gar = p.exterior.garage;
  if(gar.present){
    put('Garage', [gar.capacity?gar.capacity+' car':null, gar.attachment].filter(Boolean).join(' \u2014 ') || '(details not set)');
  } else if(gar.present===false){
    put('Garage', 'None');
  }
  put('Sprinkler system present', f(p.exterior.sprinkler.present));
  put('Site/exterior notes', p.exterior.notes);
  lines.push('');

  p.levels.forEach(lvl=>{
    lines.push('## ' + lvl.label);
    lines.push('');
    if(lvl.kind==='mechanical'){
      lvl.rooms.forEach(item=>{
        if(!item.label && item.photos.length===0) return;
        put(item.label || 'Unlabeled item', item.photos.length + ' photo(s) attached');
        put('Fuel type', item.fuelType);
        if((item.label||'').trim().toLowerCase()==='water heater') put('Water heater strapped', f(item.strapped));
      });
    } else {
      put('Smoke detector present', f(lvl.safety.smoke.present));
      put('CO detector present', f(lvl.safety.co.present));
      put('Combo unit present', f(lvl.safety.combo.present));
      lvl.rooms.forEach(r=>{
        lines.push('');
        lines.push('### ' + (r.name||'Unnamed room'));
        lines.push('');
        put('Flooring', r.flooringType);
        put('Ceiling height', r.ceilingHeight);
        put('Ceiling style', r.ceilingStyle);
        put('Condition', r.condition);
        if(r.updated && r.updated.yesNo){
          put('Updated', [r.updated.what, r.updated.when].filter(Boolean).join(' \u2014 '));
        } else if(r.updated && r.updated.yesNo===false){
          put('Updated', 'No');
        }
        put('Room notes', r.notes);
      });
    }
    lines.push('');
  });

  lines.push('## General notes');
  lines.push('');
  lines.push(p.generalNotes || '(none)');
  return lines.join('\n');
}

function collectPhotoFiles(p){
  const files = [];
  const addAll = (arr, label)=>{
    (arr||[]).forEach((ph,i)=>{
      const blob = dataURLtoBlob(ph.src);
      const name = sanitize(shortenAddressForFilename(p.address)) + ' - ' + sanitize(label) + ' - ' + (i+1) + '.jpg';
      files.push(new File([blob], name, {type:'image/jpeg', lastModified: ph.takenAt || Date.now()}));
    });
  };
  EXTERIOR_TILES.forEach(([k,label])=> addAll(p.exterior.photos[k], label));
  if(p.exterior.outbuildingPresent) addAll(p.exterior.outbuildingPhotos, 'Outbuilding');
  addAll(p.exterior.fence.front.photos, 'Front fence');
  addAll(p.exterior.fence.rear.photos, 'Rear fence');
  EXTERIOR_FEATURES.forEach(([key,label])=>{ if(p.exterior.features[key].present) addAll(p.exterior.features[key].photos, label); });
  if(p.exterior.driveway.present) addAll(p.exterior.driveway.photos, 'Driveway');
  if(p.exterior.garage.present){
    addAll(p.exterior.garage.exteriorPhotos, 'Garage - exterior');
    addAll(p.exterior.garage.interiorPhotos, 'Garage - interior');
  }
  if(p.exterior.sprinkler.present) addAll(p.exterior.sprinkler.photos, 'Sprinkler system');
  p.levels.forEach(lvl=>{
    if(lvl.kind==='mechanical'){
      lvl.rooms.forEach(item=> addAll(item.photos, lvl.label + ' - ' + (item.label||'Item')));
    } else {
      addAll(lvl.safety.smoke.photos, lvl.label + ' - Smoke detector');
      addAll(lvl.safety.co.photos, lvl.label + ' - CO detector');
      addAll(lvl.safety.combo.photos, lvl.label + ' - Combo smoke-CO unit');
      lvl.rooms.forEach(r=>{
        const rn = lvl.label + ' ' + (r.name || 'Room');
        addAll(r.roomPhotos, rn);
        addAll(r.flooringPhotos, rn + ' - Flooring (' + (r.flooringType||'unspecified') + ')');
      });
    }
  });
  return files;
}

/* ---------- Minimal ZIP builder (no compression - files are already
   JPEGs/small text, so this keeps things simple and dependency-free) ---------- */
function crc32(data){
  if(!crc32.table){
    const t = [];
    for(let n=0;n<256;n++){
      let c=n;
      for(let k=0;k<8;k++){ c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); }
      t[n]=c>>>0;
    }
    crc32.table = t;
  }
  let crc = 0xFFFFFFFF;
  for(let i=0;i<data.length;i++){ crc = crc32.table[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8); }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function toDosDateTime(msSinceEpoch){
  const d = new Date(msSinceEpoch);
  const year = Math.max(1980, d.getFullYear()); // ZIP format can't represent years before 1980
  const dosDate = (((year-1980) & 0x7F) << 9) | ((d.getMonth()+1) << 5) | d.getDate();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds()/2);
  return {dosDate, dosTime};
}

async function buildZip(files){
  const encoder = new TextEncoder();
  const localParts = [], centralParts = [];
  let offset = 0;

  for(const file of files){
    const {dosDate, dosTime} = toDosDateTime(file.lastModified || Date.now());
    const nameBytes = encoder.encode(file.name);
    const data = new Uint8Array(await file.arrayBuffer());
    const crc = crc32(data);
    const size = data.length;

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0, true);
    lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true);
    lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true);
    lh.setUint32(22, size, true);
    lh.setUint16(26, nameBytes.length, true);
    lh.setUint16(28, 0, true);
    localParts.push(new Uint8Array(lh.buffer), nameBytes, data);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true);
    ch.setUint16(14, dosDate, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true);
    ch.setUint32(24, size, true);
    ch.setUint16(28, nameBytes.length, true);
    ch.setUint32(42, offset, true);
    centralParts.push(new Uint8Array(ch.buffer), nameBytes);

    offset += 30 + nameBytes.length + size;
  }

  const centralStart = offset;
  const centralSize = centralParts.reduce((s,p)=>s+p.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, files.length, true);
  eocd.setUint16(10, files.length, true);
  eocd.setUint32(12, centralSize, true);
  eocd.setUint32(16, centralStart, true);

  return new Blob([...localParts, ...centralParts, new Uint8Array(eocd.buffer)], {type:'application/zip'});
}

async function renderExport(){
  const p = findProp(currentPropId);
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <button class="backbtn" id="backProp">&larr; Back to property</button>
      <p class="addr-line">${p.address}</p>
      <h1>Export / share</h1>
    </div>
    <div class="content">
      <div class="card">
        <p class="label">Ready to send to Dropbox</p>
        <p class="sub" id="zipStatusSub">Needs Wi-Fi. Preparing the ZIP now so Share fires instantly\u2026</p>
      </div>
      <button class="btn btn-accent" id="shareZipBtn" style="width:100%;margin-bottom:12px;" disabled>Preparing\u2026</button>
      <button class="btn" id="downloadZipBtn" style="width:100%;margin-bottom:12px;" disabled>Preparing\u2026</button>
      <button class="btn" id="shareBtn" style="width:100%;margin-bottom:12px;">Share notes & photos separately</button>
      <button class="btn" id="downloadBtn" style="width:100%;margin-bottom:12px;">Download files separately</button>
      <button class="btn" id="markSyncedBtn" style="width:100%;">Mark as synced</button>
      <div id="downloadArea" style="margin-top:16px;"></div>
    </div>
    <div class="footer-actions"><button class="btn" id="backHomeBtn">Back</button></div>
  `;
  document.getElementById('backProp').onclick = ()=>renderPropertyHome();
  document.getElementById('backHomeBtn').onclick = ()=>renderPropertyHome();

  const getAllFiles = ()=>{
    const notesFile = new File([buildNotesText(p)], sanitize(shortenAddressForFilename(p.address))+' - Field Notes.md', {type:'text/markdown'});
    return [notesFile, ...collectPhotoFiles(p)];
  };

  // Build the ZIP the moment this screen opens, not when the button is tapped -
  // that way there's no async work left to do between your tap and the actual
  // share() call, which is what was likely tripping the permission error.
  let zipFile = null;
  buildZip(getAllFiles()).then((zipBlob)=>{
    zipFile = new File([zipBlob], sanitize(shortenAddressForFilename(p.address)) + '.zip', {type:'application/zip'});
    document.getElementById('shareZipBtn').disabled = false;
    document.getElementById('shareZipBtn').textContent = 'Share as one ZIP file';
    document.getElementById('downloadZipBtn').disabled = false;
    document.getElementById('downloadZipBtn').textContent = 'Download one ZIP file';
    document.getElementById('zipStatusSub').textContent = 'Needs Wi-Fi. One ZIP file is the most reliable way to share a full property at once.';
  }).catch(()=>{
    document.getElementById('zipStatusSub').textContent = 'Could not prepare the ZIP \u2014 use "Download files separately" below instead.';
  });

  document.getElementById('shareZipBtn').onclick = async ()=>{
    if(!zipFile){ toast('Still preparing \u2014 give it one more second.', 3000); return; }
    if(navigator.canShare && navigator.canShare({files:[zipFile]})){
      try{ await navigator.share({files:[zipFile], title: p.address}); toast('Shared.'); }
      catch(err){
        if(err && err.name==='AbortError') return;
        toast('Share failed: ' + (err && err.message ? err.message : err) + ' \u2014 use "Download one ZIP file" instead, then upload it in Dropbox yourself.', 8000);
      }
    } else {
      toast('Sharing not available here \u2014 use "Download one ZIP file" below.', 6000);
    }
  };
  document.getElementById('downloadZipBtn').onclick = ()=>{
    if(!zipFile){ toast('Still preparing \u2014 give it one more second.', 3000); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zipFile);
    a.download = zipFile.name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('ZIP downloaded \u2014 open the Dropbox app and upload it from Downloads.', 6000);
  };

  document.getElementById('shareBtn').onclick = async ()=>{
    const allFiles = getAllFiles();
    const totalMB = (allFiles.reduce((sum,f)=>sum+f.size,0) / (1024*1024)).toFixed(1);
    if(navigator.canShare && navigator.canShare({files: allFiles})){
      try{
        await navigator.share({files: allFiles, title: p.address});
        toast('Shared.');
      } catch(err){
        if(err && err.name === 'AbortError') return;
        toast('Share failed (' + allFiles.length + ' files, ' + totalMB + ' MB): ' + (err && err.message ? err.message : err) + ' \u2014 try the ZIP option above instead.', 8000);
      }
    } else {
      toast('Too much to share at once (' + allFiles.length + ' files, ' + totalMB + ' MB) \u2014 try the ZIP option above instead.', 8000);
    }
  };
  document.getElementById('downloadBtn').onclick = ()=>{
    const allFiles = getAllFiles();
    const area = document.getElementById('downloadArea');
    area.innerHTML = '<p class="hint">Tap each to download, then move into the property\'s Dropbox folder:</p>';
    allFiles.forEach(f=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f); a.download = f.name; a.className='btn';
      a.style.display='block'; a.style.marginBottom='8px'; a.style.textDecoration='none';
      a.textContent = f.name; area.appendChild(a);
    });
  };
  document.getElementById('markSyncedBtn').onclick = ()=>{
    p.exported = true; saveCurrent(); toast('Marked as synced.'); renderPropertyHome();
  };
}

/* ---------- Update detection: catches new versions safely, never touches stored data ---------- */
let swRegistration = null;
const hadControllerAtBoot = !!(navigator.serviceWorker && navigator.serviceWorker.controller);

function showUpdateBanner(){
  if(document.getElementById('updateBanner')) return; // already showing
  const banner = document.createElement('div');
  banner.id = 'updateBanner';
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:var(--accent);color:#fff;padding:14px 16px;text-align:center;font-weight:700;font-size:17px;z-index:300;cursor:pointer;';
  banner.textContent = 'Update ready \u2014 tap to refresh (your data is safe)';
  banner.onclick = ()=>{ window.location.reload(); };
  document.body.appendChild(banner);
}

function watchForUpdates(reg){
  swRegistration = reg;
  if(reg.waiting && hadControllerAtBoot) showUpdateBanner();
  reg.addEventListener('updatefound', ()=>{
    const nw = reg.installing;
    if(!nw) return;
    nw.addEventListener('statechange', ()=>{
      if(nw.state === 'installed' && reg.waiting && hadControllerAtBoot) showUpdateBanner();
    });
  });
  // Belt-and-suspenders: if the active controller itself ever changes while
  // this page is open, that's a real update taking over - show the banner
  // even if the checks above raced past it.
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(hadControllerAtBoot) showUpdateBanner();
    });
  }
}

async function checkForUpdatesNow(){
  if(!swRegistration) { toast('Update checking isn\u2019t available right now.', 3000); return; }
  toast('Checking for updates\u2026', 2500);
  try{ await swRegistration.update(); }catch(e){}
}

/* ---------- Boot ---------- */
(async function boot(){
  document.getElementById('app').style.zoom = uiScale;
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(watchForUpdates).catch(()=>{});
    // Re-check every time the app comes back to the foreground (reopened, switched back to, etc.)
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible' && swRegistration){
        swRegistration.update().catch(()=>{});
      }
    });
  }
  await loadAll();
  renderHome();
})();
