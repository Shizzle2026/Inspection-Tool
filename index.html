<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Field Inspection Tool</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b5fb0">
<style>
  :root{
    --bg:#ffffff; --bg2:#f4f5f7; --line:#c7cbd1; --text:#111417; --sub:#5b616b;
    --accent:#0b5fb0; --accent-bg:#e5f0fb; --good:#1a7a3c; --warn:#a35a00; --danger:#b3261e;
  }
  *{box-sizing:border-box;}
  html, body{overscroll-behavior:none;}
  body{margin:0;font-family:-apple-system,Roboto,Segoe UI,Arial,sans-serif;background:var(--bg2);color:var(--text);font-size:18px;}
  .app{max-width:900px;margin:0 auto;background:var(--bg);}
  .topbar{padding:16px;border-bottom:2px solid var(--line);background:var(--bg);}
  .backbtn{display:block;width:100%;font-size:19px;font-weight:700;padding:14px 18px;border-radius:12px;border:2px solid var(--accent);background:var(--accent-bg);color:var(--accent);min-height:54px;margin-bottom:12px;}
  .addr-line{font-size:16px;font-weight:600;color:var(--sub);margin:0 0 2px;}
  .topbar h1{font-size:20px;margin:0;font-weight:700;}
  .btn{font-size:18px;font-weight:600;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);padding:14px 18px;min-height:52px;}
  .btn:active{background:var(--bg2);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-ghost{border:none;background:none;color:var(--accent);font-weight:700;}
  .btn-sm{padding:8px 12px;font-size:15px;min-height:40px;}
  .content{padding:16px;}
  .card{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .label{font-size:20px;font-weight:700;margin:0;}
  .sub{font-size:15px;color:var(--sub);margin:2px 0 0;}
  .fieldhead{font-size:16px;font-weight:700;margin:10px 0 0;}
  .chiprow{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .chip{font-size:17px;font-weight:600;padding:14px 18px;border-radius:12px;border:2px solid var(--line);background:var(--bg);min-height:50px;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  .chip.selected{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:2px solid var(--line);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;}
  .thumb .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:1;}
  textarea{width:100%;font-size:17px;font-family:inherit;border:2px solid var(--line);border-radius:12px;padding:12px;min-height:70px;resize:vertical;}
  input[type=text]{width:100%;font-size:19px;font-family:inherit;border:2px solid var(--line);border-radius:12px;padding:14px;min-height:52px;}
  select{width:100%;font-size:19px;font-family:inherit;border:2px solid var(--line);border-radius:12px;padding:14px;min-height:52px;background:var(--bg);color:var(--text);}
  .section-list button.navrow{width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:700;}
  .navrow .count{font-size:15px;font-weight:600;color:var(--sub);}
  .navrow .count.done{color:var(--good);}
  .proprow{display:flex;gap:8px;margin-bottom:12px;align-items:stretch;}
  .proprow .navrow{flex:1;margin-bottom:0;}
  .proprow .sidebtns{display:flex;flex-direction:column;gap:6px;}
  .proprow .sidebtns .btn{min-height:auto;padding:8px 12px;font-size:14px;}
  .levelcard{border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px;background:var(--bg2);}
  .levelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .levelhead .label{font-size:21px;}
  .safetyblock{background:var(--bg);border:2px solid var(--warn);border-radius:14px;padding:14px;margin-bottom:14px;}
  .roomcard{border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--bg);}
  .roomcard .row{margin-bottom:6px;}
  .mechcard{border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--bg);}
  .footer-actions{background:var(--bg);border-top:2px solid var(--line);padding:16px;display:flex;gap:10px;}
  .footer-actions .btn{flex:1;}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:12px;font-size:16px;max-width:90%;text-align:center;z-index:50;}
  .hint{font-size:15px;color:var(--sub);margin-top:6px;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ---------- Storage (IndexedDB) ---------- */
const DB_NAME='fieldTool', DB_VERSION=1, STORE='properties';
let dbPromise = new Promise((resolve,reject)=>{
  const req = indexedDB.open(DB_NAME, DB_VERSION);
  req.onupgradeneeded = e=>{
    const db = e.target.result;
    if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:'id'});
  };
  req.onsuccess = e=>resolve(e.target.result);
  req.onerror = e=>reject(e);
});
async function dbPut(prop){
  const db = await dbPromise;
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(prop);
    tx.oncomplete=()=>res(); tx.onerror=e=>rej(e);
  });
}
async function dbGetAll(){
  const db = await dbPromise;
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess=()=>res(req.result||[]); req.onerror=e=>rej(e);
  });
}
async function dbDelete(id){
  const db = await dbPromise;
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete=()=>res(); tx.onerror=e=>rej(e);
  });
}

/* ---------- App state ---------- */
let properties = [];
let currentPropId = null;
let currentSection = null;
let uiScale = parseFloat(localStorage.getItem('fieldTool.uiScale')) || 1;

const EXTERIOR_TILES_A = [
  ['front','Front'],
  ['frontSide1','Front and side 1'],
  ['frontSide2','Front and side 2'],
  ['driveway','Driveway'],
  ['streetScene1','Street scene'],
  ['streetScene2','Street scene'],
];
const EXTERIOR_TILES_B = [
  ['rear','Rear'],
  ['rearSide1','Rear and side 1'],
  ['rearSide2','Rear and side 2'],
];
const EXTERIOR_TILES = [...EXTERIOR_TILES_A, ...EXTERIOR_TILES_B];

// NOTE: these type lists are standard industry terms, not copied from a verified
// Fannie Mae enumeration list (I couldn't confirm the literal UAD 3.6 wording).
// Easy to relabel here once you compare against AIVRE's actual dropdowns.
const EXTERIOR_COMPONENTS = [
  ['foundation','Foundation', ['Concrete slab','Crawl space','Full basement','Partial basement','Pier and beam','Concrete block','Poured concrete','Stone','Other']],
  ['sidingTrim','Siding and trim', ['Vinyl','Wood','Brick','Brick veneer','Stucco','Fiber cement','Aluminum','Stone veneer','Log','Composite','Other']],
  ['windows','Windows', ['Single hung','Double hung','Casement','Sliding','Awning','Fixed','Bay / bow','Other']],
  ['roof','Roof', ['Asphalt shingle','Architectural shingle','Metal','Tile','Slate','Wood shake','Flat / membrane','Other']],
];

const CEILING_HEIGHT_OPTIONS = ['6 ft or less','7 ft','8 ft','9 ft','10 ft','11 ft','12 ft or more'];
const CEILING_STYLE_OPTIONS = ['Flat','Vaulted'];
const CONDITION_OPTIONS = ['New / like new','Typical wear and tear'];
const FLOORING_OPTIONS = ['Carpet','Wood','Vinyl','LVP','Tile','Laminate','Concrete','Other'];
const UPDATED_TIMEFRAMES = ['Less than 1 year','1 to 10 years'];
const FENCE_MATERIALS = ['Wood','Metal','Vinyl','Chain link'];
const FURNACE_FUELS = ['Gas','Electric','Oil','Propane'];
const WATER_HEATER_FUELS = ['Gas','Electric'];

// Porch/Patio/Deck: [key, label, type options, material options]
const EXTERIOR_FEATURES = [
  ['porch','Porch', ['Open','Covered','Enclosed','Screened'], ['Wood','Concrete','Composite','Brick','Stone','Vinyl','Other']],
  ['patio','Patio', ['Open','Covered'], ['Concrete','Pavers','Stone','Brick','Other']],
  ['deck','Deck', ['Open','Covered'], ['Wood','Composite','Vinyl','Other']],
];

const ROOM_NAME_OPTIONS = [
  'Living room','Dining room','Kitchen','Family room','Primary bedroom','Bedroom',
  'Primary bathroom','Bathroom','Half bathroom','Office / den','Laundry room',
  'Hallway / entry','Loft','Bonus room','Utility room','Other'
];
function isKitchenOrBath(name){ return /kitchen|bathroom/i.test(name||''); }

function newProperty(address){
  const components = {};
  EXTERIOR_COMPONENTS.forEach(([key])=>{ components[key] = {types:[], condition:null}; });
  const features = {};
  EXTERIOR_FEATURES.forEach(([key])=>{ features[key] = {present:null, type:null, materials:[], photos:[]}; });
  return {
    id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    address: address || '',
    createdAt: Date.now(),
    exported: false,
    appointment: null,       // datetime-local string
    effectiveDate: null,     // date string
    occupancy: null,         // 'Occupied' | 'Vacant'
    fileNumber: '',
    exterior: { photos: {}, components, features, outbuildingPresent: null, outbuildingPhotos: [],
                entranceHeight: null, drivewayMaterial: null, drivewayCapacity: null, notes: '',
                fence: { front: {present:null, materials:[], photos:[]}, rear: {present:null, materials:[], photos:[]} } },
    garage: { capacity: null, attachment: null, exteriorPhotos: [], interiorPhotos: [], notes: '' },
    levels: [],
    generalNotes: ''
  };
}

function mkRoom(name){
  return {
    id:'r_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name:name||'',
    roomPhotos:[], flooringType:null, flooringPhotos:[],
    ceilingHeight:null, ceilingStyle:null, condition:null, notes:'',
    updated: { yesNo:null, what:'', when:null }
  };
}
function mkMechItem(label){
  return { id:'m_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), label:label||'', photos:[], strapped:null, fuelType:null };
}
function mkLevel(label){
  const isMech = (label==='Mechanical area');
  const lvl = { id:'l_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), label:label, kind: isMech?'mechanical':'rooms', rooms:[] };
  if(isMech){
    lvl.rooms = [mkMechItem('Electrical panel'), mkMechItem('Furnace'), mkMechItem('Air conditioner'),
                 mkMechItem('Water heater'), mkMechItem(''), mkMechItem('')];
  } else {
    lvl.safety = { smoke:{present:null, photos:[]}, co:{present:null, photos:[]} };
    if(label==='L1' || label==='L2'){
      lvl.rooms = [mkRoom('Living room'), mkRoom('Dining room'), mkRoom('Kitchen')];
    }
  }
  return lvl;
}

function findProp(id){ return properties.find(p=>p.id===id); }
function findLevel(p, levelId){ return p.levels.find(l=>l.id===levelId); }
function findRoomAnyLevel(p, roomId){
  for(const lvl of p.levels){ const r=(lvl.rooms||[]).find(x=>x.id===roomId); if(r) return r; }
  return null;
}

function countExteriorDone(p){
  let total = EXTERIOR_TILES.length + 1;
  let done = 0;
  EXTERIOR_TILES.forEach(([k])=>{ if((p.exterior.photos[k]||[]).length>0) done++; });
  if(p.exterior.outbuildingPresent===false || (p.exterior.outbuildingPresent && p.exterior.outbuildingPhotos.length>0)) done++;
  return done+'/'+total;
}
function countGarageLabel(p){
  const n = p.garage.exteriorPhotos.length + p.garage.interiorPhotos.length;
  return n + ' photo' + (n===1?'':'s');
}
function countRoomsLabel(p){
  const roomLevels = p.levels.filter(l=>l.kind==='rooms');
  const roomCount = roomLevels.reduce((sum,l)=>sum+l.rooms.length,0);
  return p.levels.length + ' level' + (p.levels.length===1?'':'s') + ' \u2022 ' + roomCount + ' room' + (roomCount===1?'':'s');
}

/* ---------- Image compression ---------- */
function fileToCompressedDataURL(file, maxDim=1600, quality=0.75){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function dataURLtoBlob(dataURL){
  const [meta, b64] = dataURL.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
function sanitize(s){ return (s||'').replace(/[\\/:*?"<>|]/g,'-').trim(); }

/* ---------- Save/load ---------- */
async function saveCurrent(){ const p = findProp(currentPropId); if(p) await dbPut(p); }
async function loadAll(){ properties = await dbGetAll(); properties.sort((a,b)=>a.createdAt-b.createdAt); }

/* ---------- Toast ---------- */
function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2000);
}

/* ---------- Tap a thumbnail to view it full-screen, with delete right there ---------- */
function openPhotoViewer(imgEl){
  const src = imgEl.src, key = imgEl.dataset.key, idx = imgEl.dataset.idx;
  const tileCard = imgEl.closest('.card');
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:20px;gap:16px;';
  overlay.innerHTML = `
    <img src="${src}" style="max-width:100%;max-height:70vh;border-radius:8px;object-fit:contain;">
    <div style="display:flex;gap:12px;">
      <button class="btn" id="viewerClose">Close</button>
      <button class="btn" id="viewerDelete" style="background:var(--danger);border-color:var(--danger);color:#fff;">Delete photo</button>
    </div>
  `;
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  document.body.appendChild(overlay);
  overlay.querySelector('#viewerClose').onclick = ()=>overlay.remove();
  overlay.querySelector('#viewerDelete').onclick = ()=>{
    overlay.remove();
    const delBtn = tileCard.querySelector(`[data-delkey="${key}"][data-delidx="${idx}"]`);
    if(delBtn) delBtn.click();
  };
}

/* ---------- Custom modal dialogs (native prompt/confirm aren't reliable in every embedded browser) ---------- */
function showModal(innerHTML){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;';
  overlay.innerHTML = `<div class="card" style="max-width:400px;width:100%;margin:0;">${innerHTML}</div>`;
  document.body.appendChild(overlay);
  return overlay;
}
function askText(title, placeholder, onOk){
  const overlay = showModal(`
    <p class="label">${title}</p>
    <input type="text" id="modalInput" placeholder="${placeholder||''}" style="margin-top:10px;">
    <div class="row" style="margin-top:14px;gap:10px;">
      <button class="btn" id="modalCancel" style="flex:1;">Cancel</button>
      <button class="btn btn-accent" id="modalOk" style="flex:1;">OK</button>
    </div>
  `);
  const input = overlay.querySelector('#modalInput');
  setTimeout(()=>input.focus(), 50);
  overlay.querySelector('#modalCancel').onclick = ()=>overlay.remove();
  overlay.querySelector('#modalOk').onclick = ()=>{ const v=input.value; overlay.remove(); onOk(v); };
  input.onkeydown = (e)=>{ if(e.key==='Enter'){ const v=input.value; overlay.remove(); onOk(v); } };
}
function askConfirm(title, message, onYes){
  const overlay = showModal(`
    <p class="label">${title}</p>
    <p class="sub" style="margin-top:6px;">${message||''}</p>
    <div class="row" style="margin-top:14px;gap:10px;">
      <button class="btn" id="modalCancel" style="flex:1;">Cancel</button>
      <button class="btn" id="modalYes" style="flex:1;background:var(--danger);border-color:var(--danger);color:#fff;">Confirm</button>
    </div>
  `);
  overlay.querySelector('#modalCancel').onclick = ()=>overlay.remove();
  overlay.querySelector('#modalYes').onclick = ()=>{ overlay.remove(); onYes(); };
}

function formatAppt(iso){
  if(!iso) return '';
  try{
    const d = new Date(iso);
    return d.toLocaleString(undefined, {weekday:'short', month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit'});
  }catch(e){ return iso; }
}

/* ---------- New property / edit property details, with online-only address autocomplete ---------- */
function askPropertyDetails(existing, onOk){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;';
  const esc = (s)=> (s||'').replace(/"/g,'&quot;');
  overlay.innerHTML = `<div class="card" style="max-width:440px;width:100%;margin:0;max-height:85vh;overflow-y:auto;">
    <p class="label">${existing ? 'Edit property details' : 'New property'}</p>

    <p class="fieldhead">Address</p>
    <input type="text" id="npAddress" value="${existing?esc(existing.address):''}" placeholder="Start typing..." autocomplete="off">
    <div id="npSuggestions" style="margin-top:6px;display:flex;flex-direction:column;gap:6px;"></div>
    <p class="hint" id="npAddrHint" style="display:none;">Suggestions need Wi-Fi \u2014 typing still works fine offline.</p>

    <p class="fieldhead">Appointment date & time</p>
    <input type="datetime-local" id="npAppt" value="${existing&&existing.appointment?existing.appointment:''}" style="width:100%;font-size:17px;font-family:inherit;border:2px solid var(--line);border-radius:12px;padding:12px;min-height:48px;">

    <p class="fieldhead">Effective date</p>
    <input type="date" id="npEffective" value="${existing&&existing.effectiveDate?existing.effectiveDate:''}" style="width:100%;font-size:17px;font-family:inherit;border:2px solid var(--line);border-radius:12px;padding:12px;min-height:48px;">

    <p class="fieldhead">Occupied or vacant?</p>
    <div class="chiprow">
      <button class="chip ${existing&&existing.occupancy==='Occupied'?'selected':''}" data-occ="Occupied">Occupied</button>
      <button class="chip ${existing&&existing.occupancy==='Vacant'?'selected':''}" data-occ="Vacant">Vacant</button>
    </div>

    <p class="fieldhead">File number</p>
    <input type="text" id="npFileNum" value="${existing?esc(existing.fileNumber||''):''}" placeholder="Optional">

    <div class="row" style="margin-top:14px;gap:10px;">
      <button class="btn" id="modalCancel" style="flex:1;">Cancel</button>
      <button class="btn btn-accent" id="modalOk" style="flex:1;">${existing?'Save':'Create'}</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  const addrInput = overlay.querySelector('#npAddress');
  const sugBox = overlay.querySelector('#npSuggestions');
  const addrHint = overlay.querySelector('#npAddrHint');
  setTimeout(()=>addrInput.focus(), 50);

  let occupancy = existing ? (existing.occupancy||null) : null;
  overlay.querySelectorAll('[data-occ]').forEach(btn=>{
    btn.onclick = ()=>{
      occupancy = (occupancy===btn.dataset.occ) ? null : btn.dataset.occ;
      overlay.querySelectorAll('[data-occ]').forEach(b=>b.classList.toggle('selected', b.dataset.occ===occupancy));
    };
  });

  let debounceTimer=null;
  addrInput.oninput = ()=>{
    clearTimeout(debounceTimer);
    const q = addrInput.value.trim();
    sugBox.innerHTML = '';
    if(q.length<4) { addrHint.style.display='none'; return; }
    if(!navigator.onLine){ addrHint.style.display='block'; return; }
    addrHint.style.display='none';
    debounceTimer = setTimeout(async ()=>{
      try{
        const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=0&limit=5&q='+encodeURIComponent(q));
        const data = await res.json();
        sugBox.innerHTML = data.map((d,i)=>`<button type="button" class="btn btn-sm" data-sugidx="${i}" style="text-align:left;">${d.display_name}</button>`).join('');
        sugBox.querySelectorAll('[data-sugidx]').forEach(b=>{
          b.onclick = ()=>{ addrInput.value = data[parseInt(b.dataset.sugidx,10)].display_name; sugBox.innerHTML=''; };
        });
      }catch(e){ /* offline or blocked - plain typing still works, fail silently */ }
    }, 450);
  };

  overlay.querySelector('#modalCancel').onclick = ()=>overlay.remove();
  overlay.querySelector('#modalOk').onclick = ()=>{
    const data = {
      address: addrInput.value.trim(),
      appointment: overlay.querySelector('#npAppt').value || null,
      effectiveDate: overlay.querySelector('#npEffective').value || null,
      occupancy: occupancy,
      fileNumber: overlay.querySelector('#npFileNum').value.trim()
    };
    overlay.remove();
    onOk(data);
  };
}

/* ---------- Tap vs. long-press helper ---------- */
function bindTapHold(el, onTap, onHold, holdMs){
  holdMs = holdMs || 550;
  let timer=null, firedHold=false;
  const start=()=>{ firedHold=false; timer=setTimeout(()=>{ firedHold=true; onHold(); }, holdMs); };
  const clearTimer=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  const end=()=>{ clearTimer(); if(!firedHold) onTap(); };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointerleave', clearTimer);
  el.addEventListener('pointercancel', clearTimer);
}

/* ---------- Tap to select, fast double-tap on the same chip to clear ---------- */
function bindSingleSelectTap(el, getCurrent, val, onSet){
  el.onclick = ()=>{
    if(getCurrent()!==val){ onSet(val); return; }
    const now = Date.now();
    const last = el._lastTapTime || 0;
    el._lastTapTime = now;
    if(now - last < 400){ el._lastTapTime = 0; onSet(null); }
  };
}
function bindAddRemoveTap(el, isSelected, onAdd, onRemove){
  el.onclick = ()=>{
    if(!isSelected()){ onAdd(); return; }
    const now = Date.now();
    const last = el._lastTapTime || 0;
    el._lastTapTime = now;
    if(now - last < 400){ el._lastTapTime = 0; onRemove(); }
  };
}

/* ---------- Render: Home ---------- */
let homeView = 'active';
function renderHome(){
  const app = document.getElementById('app');
  const list = properties.filter(p => homeView==='archived' ? p.exported : !p.exported);
  list.sort((a,b)=>{
    if(!a.appointment && !b.appointment) return a.createdAt-b.createdAt;
    if(!a.appointment) return 1;
    if(!b.appointment) return -1;
    return a.appointment.localeCompare(b.appointment);
  });
  const rows = list.map(p=>`
    <div class="proprow">
      <button class="navrow" data-open="${p.id}" style="align-items:flex-start;">
        <span>
          ${p.address || '(no address yet)'}
          ${p.appointment ? `<br><span style="font-size:14px;font-weight:500;color:var(--sub);">${formatAppt(p.appointment)}</span>` : ''}
        </span>
        <span class="count ${p.exported?'done':''}">${p.exported?'synced':'not synced'}</span>
      </button>
      <div class="sidebtns">
        <button class="btn" data-quicksync="${p.id}">Sync</button>
        <button class="btn" data-delprop="${p.id}">Delete</button>
      </div>
    </div>
  `).join('');
  app.innerHTML = `
    <div class="topbar" style="display:flex;align-items:center;justify-content:space-between;">
      <h1>${homeView==='archived' ? 'Archived' : "Today's properties"}</h1>
      <button class="btn btn-sm" id="settingsBtn">Settings</button>
    </div>
    <div class="content">
      <div class="chiprow" style="margin-top:0;margin-bottom:14px;">
        <button class="chip ${homeView==='active'?'selected':''}" id="viewActive">Active</button>
        <button class="chip ${homeView==='archived'?'selected':''}" id="viewArchived">Archived</button>
      </div>
      <div class="section-list">${rows || '<p class="hint">Nothing here yet.</p>'}</div>
    </div>
    <div class="footer-actions">
      <button class="btn btn-accent" id="addPropBtn">+ New property</button>
    </div>
  `;
  document.getElementById('viewActive').onclick = ()=>{ homeView='active'; renderHome(); };
  document.getElementById('viewArchived').onclick = ()=>{ homeView='archived'; renderHome(); };
  document.getElementById('settingsBtn').onclick = ()=>renderSettings();
  app.querySelectorAll('[data-open]').forEach(btn=>{
    btn.onclick = ()=>{ currentPropId = btn.dataset.open; currentSection=null; renderPropertyHome(); };
  });
  app.querySelectorAll('[data-quicksync]').forEach(btn=>{
    btn.onclick = ()=>{ currentPropId = btn.dataset.quicksync; renderExport(); };
  });
  app.querySelectorAll('[data-delprop]').forEach(btn=>{
    btn.onclick = ()=>{
      const p = findProp(btn.dataset.delprop);
      askConfirm('Delete this property?', (p.address||'This property') + ' will be removed for good. This cannot be undone.', async ()=>{
        await dbDelete(btn.dataset.delprop);
        properties = properties.filter(x=>x.id!==btn.dataset.delprop);
        renderHome();
      });
    };
  });
  document.getElementById('addPropBtn').onclick = ()=>{
    askPropertyDetails(null, (data)=>{
      if(!data.address) return;
      const p = newProperty(data.address);
      p.appointment = data.appointment;
      p.effectiveDate = data.effectiveDate;
      p.occupancy = data.occupancy;
      p.fileNumber = data.fileNumber;
      properties.push(p);
      dbPut(p).then(()=>{ currentPropId=p.id; renderPropertyHome(); });
    });
  };
}

/* ---------- Photo tile helper ---------- */
function photoTileHTML(key, label, photos){
  const thumbs = (photos||[]).map((src,i)=>`
    <div class="thumb"><img src="${src}" data-key="${key}" data-idx="${i}" onclick="openPhotoViewer(this)"><button class="del" data-delkey="${key}" data-delidx="${i}">&times;</button></div>
  `).join('');
  return `
    <div class="card">
      <div class="row">
        <div><p class="label">${label}</p><p class="sub">${(photos||[]).length} photo${(photos||[]).length===1?'':'s'}</p></div>
        <label class="btn btn-accent btn-sm" style="cursor:pointer;">Add
          <input type="file" accept="image/*" capture="environment" multiple style="display:none;" data-camkey="${key}">
        </label>
      </div>
      <div class="thumbs">${thumbs}</div>
    </div>
  `;
}
function wirePhotoTile(container, key, getArr, rerender){
  const input = container.querySelector(`input[data-camkey="${key}"]`);
  if(input){
    input.onchange = async (e)=>{
      const files = Array.from(e.target.files||[]);
      for(const f of files){ const c = await fileToCompressedDataURL(f); getArr().push(c); }
      saveCurrent(); rerender();
    };
  }
  container.querySelectorAll(`[data-delkey="${key}"]`).forEach(btn=>{
    btn.onclick = ()=>{ getArr().splice(parseInt(btn.dataset.delidx,10),1); saveCurrent(); rerender(); };
  });
}

      <div class="row" style="align-items:flex-start;gap:12px;">
        <div style="flex:1;">
          <select data-roomselect="${r.id}" style="width:100%;font-weight:700;font-size:19px;">${nameOpts}</select>
          ${showOtherBox ? `<input type="text" data-roomcustom="${r.id}" value="${r.name==='Other'?'':r.name}" placeholder="Type room name" style="margin-top:8px;">` : ''}
          <button class="btn btn-sm" data-delroom="${r.id}" style="margin-top:8px;">Remove</button>
        </div>
        <div style="flex:1;">
          ${photoTileHTML('room_'+r.id, 'Photo of room', r.roomPhotos)}
        </div>
      </div>

      <p class="fieldhead">Flooring type</p>
      <div class="chiprow">${floorChips}</div>
      ${photoTileHTML('floor_'+r.id, 'Flooring photo', r.flooringPhotos)}

      <p class="fieldhead">Ceiling height</p>
      <p class="sub">Measured at highest point &mdash; nearest foot (UAD 3.6)</p>
      <div class="chiprow">${ceilChips}</div>

      <p class="fieldhead">Ceiling style</p>
      <div class="chiprow">${styleChips}</div>

      <p class="fieldhead">Condition</p>
      <div class="chiprow">${condChips}</div>

      ${updatedBlock}

      <p class="fieldhead">Notes</p>
      <textarea data-roomnotes="${r.id}" placeholder="Anything specific to this room...">${r.notes||''}</textarea>
    </div>`;
  };

  const mechCardHTML = (item)=>{
    const lbl = (item.label||'').trim().toLowerCase();
    const isWaterHeater = lbl==='water heater';
    const isFurnace = lbl==='furnace';
    return `
    <div class="mechcard" data-mechid="${item.id}">
      <div class="row">
        <input type="text" data-mechlabel="${item.id}" value="${item.label}" placeholder="Label this photo (e.g. Water softener)">
        <button class="btn btn-sm" data-delmech="${item.id}">Remove</button>
      </div>
      ${photoTileHTML('mech_'+item.id, item.label || 'Photo', item.photos)}
      ${isFurnace ? `
        <p class="fieldhead">Fuel type</p>
        <div class="chiprow">
          ${FURNACE_FUELS.map(v=>`<button class="chip ${item.fuelType===v?'selected':''}" data-fuel="${item.id}" data-val="${v}">${v}</button>`).join('')}
        </div>
      ` : ''}
      ${isWaterHeater ? `
        <p class="fieldhead">Fuel type</p>
        <div class="chiprow">
          ${WATER_HEATER_FUELS.map(v=>`<button class="chip ${item.fuelType===v?'selected':''}" data-fuel="${item.id}" data-val="${v}">${v}</button>`).join('')}
        </div>
        <div class="row" style="margin-top:4px;">
          <p class="label" style="font-size:17px;">Water heater strapped?</p>
          <div class="chiprow" style="margin-top:0;">
            <button class="chip ${item.strapped===true?'selected':''}" data-strap="${item.id}" data-val="yes">Yes</button>
            <button class="chip ${item.strapped===false?'selected':''}" data-strap="${item.id}" data-val="no">No</button>
          </div>
        </div>
        <p class="hint">Hold a button down to clear it.</p>
      ` : ''}
    </div>`;
  };

  const levelsHTML = p.levels.map(lvl=>{
    if(lvl.kind==='mechanical'){
      return `
      <div class="levelcard" data-levelid="${lvl.id}">
        <div class="levelhead">
          <p class="label">${lvl.label}</p>
          <button class="btn btn-sm" data-dellevel="${lvl.id}">Remove</button>
        </div>
        ${lvl.rooms.map(mechCardHTML).join('')}
        <button class="btn btn-accent" data-addmech="${lvl.id}" style="width:100%;">+ Add item to ${lvl.label}</button>
      </div>`;
    }
    return `
    <div class="levelcard" data-levelid="${lvl.id}">
      <div class="levelhead">
        <p class="label">${lvl.label}</p>
        <button class="btn btn-sm" data-dellevel="${lvl.id}">Remove level</button>
      </div>
      <div class="safetyblock">
        <p class="label" style="font-size:18px;">Smoke & CO detectors &mdash; required every level</p>
        ${safetyDetectorRow(lvl,'smoke','Smoke detector present')}
        ${safetyDetectorRow(lvl,'co','CO detector present')}
      </div>
      ${lvl.rooms.map(roomCardHTML).join('')}
      <button class="btn btn-accent" data-addroom="${lvl.id}" style="width:100%;">+ Add room to ${lvl.label}</button>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="topbar">
      <button class="backbtn" id="backProp">&larr; Back to property</button>
      <p class="addr-line">${p.address}</p>
      <h1>Interior</h1>
    </div>
    <div class="content">
      ${levelsHTML}
      <p class="label" style="margin:16px 0 8px;">Add a level</p>
      <div class="chiprow">
        <button class="btn" data-addlevel="L1">+ L1</button>
        <button class="btn" data-addlevel="L2">+ L2</button>
        <button class="btn" data-addlevel="B1">+ B1</button>
        <button class="btn" data-addlevel="Mechanical area">+ Mechanical area</button>
        <button class="btn" data-addlevel="custom">+ Custom</button>
      </div>
    </div>
    <div class="footer-actions"><button class="btn" id="backHomeBtn">Done</button></div>
  `;

  document.getElementById('backProp').onclick = ()=>renderPropertyHome();
  document.getElementById('backHomeBtn').onclick = ()=>renderPropertyHome();

  app.querySelectorAll('[data-det]').forEach(btn=>{
    const [levelId,key] = btn.dataset.det.split('|');
    const val = (btn.dataset.val==='yes');
    bindTapHold(btn,
      ()=>{ findLevel(p,levelId).safety[key].present = val; saveCurrent(); renderRooms(); },
      ()=>{ findLevel(p,levelId).safety[key].present = null; saveCurrent(); toast('Cleared.'); renderRooms(); }
    );
  });
  p.levels.filter(l=>l.kind==='rooms').forEach(lvl=>{
    wirePhotoTile(app, 'det_'+lvl.id+'_smoke', ()=>lvl.safety.smoke.photos, renderRooms);
    wirePhotoTile(app, 'det_'+lvl.id+'_co', ()=>lvl.safety.co.photos, renderRooms);
  });

  app.querySelectorAll('[data-addlevel]').forEach(btn=>{
    btn.onclick = ()=>{
      let label = btn.dataset.addlevel;
      if(label==='custom'){
        askText('Level label', 'e.g. L3, Attic', (custom)=>{
          if(!custom || !custom.trim()) return;
          p.levels.push(mkLevel(custom.trim()));
          saveCurrent(); renderRooms();
        });
        return;
      }
      p.levels.push(mkLevel(label));
      saveCurrent(); renderRooms();
    };
  });
  app.querySelectorAll('[data-dellevel]').forEach(btn=>{
    btn.onclick = ()=>{
      askConfirm('Remove this level?', 'Everything inside it goes too.', ()=>{
        p.levels = p.levels.filter(l=>l.id!==btn.dataset.dellevel);
        saveCurrent(); renderRooms();
      });
    };
  });

  app.querySelectorAll('[data-addroom]').forEach(btn=>{
    btn.onclick = ()=>{ findLevel(p,btn.dataset.addroom).rooms.push(mkRoom('')); saveCurrent(); renderRooms(); };
  });
  app.querySelectorAll('[data-delroom]').forEach(btn=>{
    btn.onclick = ()=>{
      askConfirm('Remove this room?', '', ()=>{
        p.levels.forEach(lvl=>{ if(lvl.kind==='rooms') lvl.rooms = lvl.rooms.filter(r=>r.id!==btn.dataset.delroom); });
        saveCurrent(); renderRooms();
      });
    };
  });
  app.querySelectorAll('[data-roomselect]').forEach(sel=>{
    sel.onchange = ()=>{ findRoomAnyLevel(p,sel.dataset.roomselect).name = sel.value; saveCurrent(); renderRooms(); };
  });
  app.querySelectorAll('[data-roomcustom]').forEach(inp=>{
    inp.onblur = ()=>{ const r=findRoomAnyLevel(p,inp.dataset.roomcustom); if(inp.value.trim()) r.name=inp.value.trim(); saveCurrent(); };
  });
  app.querySelectorAll('[data-roomnotes]').forEach(ta=>{
    ta.onblur = ()=>{ findRoomAnyLevel(p,ta.dataset.roomnotes).notes = ta.value; saveCurrent(); };
  });
  app.querySelectorAll('[data-ceil]').forEach(btn=>{
    const r = findRoomAnyLevel(p,btn.dataset.ceil);
    bindSingleSelectTap(btn, ()=>r.ceilingHeight, btn.dataset.ceilval, (v)=>{ r.ceilingHeight=v; saveCurrent(); renderRooms(); });
  });
  app.querySelectorAll('[data-style]').forEach(btn=>{
    const r = findRoomAnyLevel(p,btn.dataset.style);
    bindSingleSelectTap(btn, ()=>r.ceilingStyle, btn.dataset.styleval, (v)=>{ r.ceilingStyle=v; saveCurrent(); renderRooms(); });
  });
  app.querySelectorAll('[data-cond]').forEach(btn=>{
    const r = findRoomAnyLevel(p,btn.dataset.cond);
    bindSingleSelectTap(btn, ()=>r.condition, btn.dataset.condval, (v)=>{ r.condition=v; saveCurrent(); renderRooms(); });
  });
  app.querySelectorAll('[data-floor]').forEach(btn=>{
    const r = findRoomAnyLevel(p,btn.dataset.floor);
    bindSingleSelectTap(btn, ()=>r.flooringType, btn.dataset.floorval, (v)=>{ r.flooringType=v; saveCurrent(); renderRooms(); });
  });
  app.querySelectorAll('[data-updyn]').forEach(btn=>{
    const r = findRoomAnyLevel(p,btn.dataset.updyn);
    const v = (btn.dataset.val==='yes');
    bindSingleSelectTap(btn, ()=>r.updated.yesNo, v, (val)=>{ r.updated.yesNo=val; saveCurrent(); renderRooms(); });
  });
  app.querySelectorAll('[data-updwhat]').forEach(inp=>{
    inp.onblur = ()=>{ findRoomAnyLevel(p,inp.dataset.updwhat).updated.what = inp.value; saveCurrent(); };
  });
  app.querySelectorAll('[data-updwhen]').forEach(btn=>{
    const r = findRoomAnyLevel(p,btn.dataset.updwhen);
    bindSingleSelectTap(btn, ()=>r.updated.when, btn.dataset.val, (v)=>{ r.updated.when=v; saveCurrent(); renderRooms(); });
  });
  p.levels.filter(l=>l.kind==='rooms').forEach(lvl=>{
    lvl.rooms.forEach(r=>{
      wirePhotoTile(app, 'room_'+r.id, ()=>r.roomPhotos, renderRooms);
      wirePhotoTile(app, 'floor_'+r.id, ()=>r.flooringPhotos, renderRooms);
    });
  });

  app.querySelectorAll('[data-addmech]').forEach(btn=>{
    btn.onclick = ()=>{ findLevel(p,btn.dataset.addmech).rooms.push(mkMechItem('')); saveCurrent(); renderRooms(); };
  });
  app.querySelectorAll('[data-delmech]').forEach(btn=>{
    btn.onclick = ()=>{
      askConfirm('Remove this item?', '', ()=>{
        p.levels.forEach(lvl=>{ if(lvl.kind==='mechanical') lvl.rooms = lvl.rooms.filter(m=>m.id!==btn.dataset.delmech); });
        saveCurrent(); renderRooms();
      });
    };
  });
  app.querySelectorAll('[data-mechlabel]').forEach(inp=>{
    inp.onblur = ()=>{
      const lvl = p.levels.find(l=>l.kind==='mechanical' && l.rooms.some(m=>m.id===inp.dataset.mechlabel));
      const item = lvl.rooms.find(m=>m.id===inp.dataset.mechlabel);
      item.label = inp.value.trim();
      saveCurrent(); renderRooms();
    };
  });
  app.querySelectorAll('[data-strap]').forEach(btn=>{
    const itemId = btn.dataset.strap, val = (btn.dataset.val==='yes');
    const lvl = p.levels.find(l=>l.kind==='mechanical' && l.rooms.some(m=>m.id===itemId));
    const item = lvl.rooms.find(m=>m.id===itemId);
    bindTapHold(btn,
      ()=>{ item.strapped = val; saveCurrent(); renderRooms(); },
      ()=>{ item.strapped = null; saveCurrent(); toast('Cleared.'); renderRooms(); }
    );
  });
  app.querySelectorAll('[data-fuel]').forEach(btn=>{
    const itemId = btn.dataset.fuel;
    const lvl = p.levels.find(l=>l.kind==='mechanical' && l.rooms.some(m=>m.id===itemId));
    const item = lvl.rooms.find(m=>m.id===itemId);
    bindSingleSelectTap(btn, ()=>item.fuelType, btn.dataset.val, (v)=>{ item.fuelType=v; saveCurrent(); renderRooms(); });
  });
  p.levels.filter(l=>l.kind==='mechanical').forEach(lvl=>{
    lvl.rooms.forEach(item=>{ wirePhotoTile(app, 'mech_'+item.id, ()=>item.photos, renderRooms); });
  });
}

/* ---------- Render: General notes ---------- */
function renderNotes(){
  const p = findProp(currentPropId);
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <button class="backbtn" id="backProp">&larr; Back to property</button>
      <p class="addr-line">${p.address}</p>
      <h1>General notes</h1>
    </div>
    <div class="content">
      <div class="card"><textarea id="genNotes" style="min-height:220px;" placeholder="Anything that doesn't fit elsewhere...">${p.generalNotes||''}</textarea></div>
    </div>
    <div class="footer-actions"><button class="btn" id="backHomeBtn">Done</button></div>
  `;
  document.getElementById('backProp').onclick = ()=>renderPropertyHome();
  document.getElementById('backHomeBtn').onclick = ()=>{ p.generalNotes = document.getElementById('genNotes').value; saveCurrent(); renderPropertyHome(); };
}

/* ---------- Export ---------- */
function buildNotesText(p){
  const f = v => v===true?'Yes':(v===false?'No':null);
  let lines = [];
  const put = (label, val) => { if(val!==null && val!==undefined && val!=='') lines.push(label + ': ' + val); };

  lines.push('FIELD NOTES \u2014 ' + p.address);
  put('File number', p.fileNumber);
  put('Inspection date/time', p.appointment ? formatAppt(p.appointment) : null);
  put('Effective date', p.effectiveDate);
  put('Occupancy', p.occupancy);
  lines.push('');
  lines.push('EXTERIOR');
  EXTERIOR_COMPONENTS.forEach(([key,label])=>{
    const c = p.exterior.components[key];
    const parts = [...c.types, c.condition].filter(Boolean);
    if(parts.length) put(label, parts.join(', '));
  });
  put('Entrance height above grade', p.exterior.entranceHeight);
  put('Driveway material', p.exterior.drivewayMaterial);
  put('Driveway capacity', p.exterior.drivewayCapacity ? p.exterior.drivewayCapacity + ' car' : null);
  put('Outbuilding present', f(p.exterior.outbuildingPresent));
  ['front','rear'].forEach(side=>{
    const fen = p.exterior.fence[side];
    if(fen.present){
      put((side==='front'?'Front':'Rear') + ' fence', fen.materials.join(', ') || '(material not set)');
    } else if(fen.present===false){
      put((side==='front'?'Front':'Rear') + ' fence', 'None');
    }
  });
  EXTERIOR_FEATURES.forEach(([key,label])=>{
    const feat = p.exterior.features[key];
    if(feat.present){
      put(label, [feat.type, feat.materials.join(', ')].filter(Boolean).join(' \u2014 ') || '(details not set)');
    } else if(feat.present===false){
      put(label, 'None');
    }
  });
  put('Site/exterior notes', p.exterior.notes);
  lines.push('');

  lines.push('GARAGE');
  put('Car capacity', p.garage.capacity ? p.garage.capacity + ' car' : null);
  put('Attached or detached', p.garage.attachment);
  put('Exterior photos', p.garage.exteriorPhotos.length ? p.garage.exteriorPhotos.length+' photo(s)' : null);
  put('Interior photos', p.garage.interiorPhotos.length ? p.garage.interiorPhotos.length+' photo(s)' : null);
  put('Garage notes', p.garage.notes);
  lines.push('');

  p.levels.forEach(lvl=>{
    if(lvl.kind==='mechanical'){
      lines.push(lvl.label);
      lvl.rooms.forEach(item=>{
        if(!item.label && item.photos.length===0) return;
        put(item.label || 'Unlabeled item', item.photos.length + ' photo(s) attached');
        put('  Fuel type', item.fuelType);
        if((item.label||'').trim().toLowerCase()==='water heater') put('Water heater strapped', f(item.strapped));
      });
    } else {
      lines.push(lvl.label);
      put('Smoke detector present', f(lvl.safety.smoke.present));
      put('CO detector present', f(lvl.safety.co.present));
      lvl.rooms.forEach(r=>{
        lines.push('Room: ' + (r.name||'Unnamed room'));
        put('  Flooring', r.flooringType);
        put('  Ceiling height', r.ceilingHeight);
        put('  Ceiling style', r.ceilingStyle);
        put('  Condition', r.condition);
        if(r.updated && r.updated.yesNo){
          put('  Updated', [r.updated.what, r.updated.when].filter(Boolean).join(' \u2014 '));
        } else if(r.updated && r.updated.yesNo===false){
          put('  Updated', 'No');
        }
        put('  Room notes', r.notes);
      });
    }
    lines.push('');
  });

  put('General notes', p.generalNotes);
  return lines.join('\n');
}

function collectPhotoFiles(p){
  const files = [];
  const addAll = (arr, label)=>{
    (arr||[]).forEach((src,i)=>{
      const blob = dataURLtoBlob(src);
      const name = sanitize(p.address) + ' - ' + sanitize(label) + ' - ' + (i+1) + '.jpg';
      files.push(new File([blob], name, {type:'image/jpeg'}));
    });
  };
  EXTERIOR_TILES.forEach(([k,label])=> addAll(p.exterior.photos[k], label));
  if(p.exterior.outbuildingPresent) addAll(p.exterior.outbuildingPhotos, 'Outbuilding');
  addAll(p.exterior.fence.front.photos, 'Front fence');
  addAll(p.exterior.fence.rear.photos, 'Rear fence');
  EXTERIOR_FEATURES.forEach(([key,label])=>{ if(p.exterior.features[key].present) addAll(p.exterior.features[key].photos, label); });
  addAll(p.garage.exteriorPhotos, 'Garage - exterior');
  addAll(p.garage.interiorPhotos, 'Garage - interior');
  p.levels.forEach(lvl=>{
    if(lvl.kind==='mechanical'){
      lvl.rooms.forEach(item=> addAll(item.photos, lvl.label + ' - ' + (item.label||'Item')));
    } else {
      addAll(lvl.safety.smoke.photos, lvl.label + ' - Smoke detector');
      addAll(lvl.safety.co.photos, lvl.label + ' - CO detector');
      lvl.rooms.forEach(r=>{
        const rn = lvl.label + ' ' + (r.name || 'Room');
        addAll(r.roomPhotos, rn);
        addAll(r.flooringPhotos, rn + ' - Flooring (' + (r.flooringType||'unspecified') + ')');
      });
    }
  });
  return files;
}

async function renderExport(){
  const p = findProp(currentPropId);
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <button class="backbtn" id="backProp">&larr; Back to property</button>
      <p class="addr-line">${p.address}</p>
      <h1>Export / share</h1>
    </div>
    <div class="content">
      <div class="card">
        <p class="label">Ready to send to Dropbox</p>
        <p class="sub">Needs Wi-Fi. Tap Share, then pick Dropbox and the property's folder.</p>
      </div>
      <button class="btn btn-accent" id="shareBtn" style="width:100%;margin-bottom:12px;">Share notes & photos</button>
      <button class="btn" id="downloadBtn" style="width:100%;margin-bottom:12px;">Download files instead</button>
      <button class="btn" id="markSyncedBtn" style="width:100%;">Mark as synced</button>
      <div id="downloadArea" style="margin-top:16px;"></div>
    </div>
    <div class="footer-actions"><button class="btn" id="backHomeBtn">Back</button></div>
  `;
  document.getElementById('backProp').onclick = ()=>renderPropertyHome();
  document.getElementById('backHomeBtn').onclick = ()=>renderPropertyHome();

  document.getElementById('shareBtn').onclick = async ()=>{
    const notesFile = new File([buildNotesText(p)], sanitize(p.address)+' - Field Notes.txt', {type:'text/plain'});
    const allFiles = [notesFile, ...collectPhotoFiles(p)];
    if(navigator.canShare && navigator.canShare({files: allFiles})){
      try{ await navigator.share({files: allFiles, title: p.address}); toast('Shared.'); } catch(err){}
    } else { toast('Sharing not supported here \u2014 use "Download files instead" below.'); }
  };
  document.getElementById('downloadBtn').onclick = ()=>{
    const notesFile = new File([buildNotesText(p)], sanitize(p.address)+' - Field Notes.txt', {type:'text/plain'});
    const allFiles = [notesFile, ...collectPhotoFiles(p)];
    const area = document.getElementById('downloadArea');
    area.innerHTML = '<p class="hint">Tap each to download, then move into the property\'s Dropbox folder:</p>';
    allFiles.forEach(f=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f); a.download = f.name; a.className='btn';
      a.style.display='block'; a.style.marginBottom='8px'; a.style.textDecoration='none';
      a.textContent = f.name; area.appendChild(a);
    });
  };
  document.getElementById('markSyncedBtn').onclick = ()=>{
    p.exported = true; saveCurrent(); toast('Marked as synced.'); renderPropertyHome();
  };
}

/* ---------- Boot ---------- */
(async function boot(){
  document.getElementById('app').style.zoom = uiScale;
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  await loadAll();
  renderHome();
})();
